<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swift Macros Diagram</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #f5f7fb; --surface: #ffffff; --ink: #172033; --muted: #5a6478; --line: #c9d1df;
  --value: #0f7f63; --value-soft: #dcf2ea;
  --shared: #6447d1; --shared-soft: #ebe6fb;
  --changed: #a76a12; --changed-soft: #fcefd6;
  --code-bg: #eef1f7;
  --font-body: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141c; --surface: #171e29; --ink: #e6ebf2; --muted: #9aa5b8;
  --line: #3a4658; --value: #45cfa3; --value-soft: #13362c; --shared: #a690ff; --shared-soft: #251f42;
  --changed: #f2c14e; --changed-soft: #3a2e12; --code-bg: #111821; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f141c; --surface: #171e29; --ink: #e6ebf2; --muted: #9aa5b8;
  --line: #3a4658; --value: #45cfa3; --value-soft: #13362c; --shared: #a690ff; --shared-soft: #251f42;
  --changed: #f2c14e; --changed-soft: #3a2e12; --code-bg: #111821; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 900px; margin: 0 auto; display: grid; gap: 20px; }
.eyebrow { font-size: 13px; font-weight: 500; letter-spacing: 0.04em; color: var(--muted); margin: 0; }
h1 { font-size: clamp(24px, 4.4vw, 34px); line-height: 1.15; margin: 4px 0 6px; text-wrap: balance; font-weight: 700; }
.lede { margin: 0; color: var(--muted); max-width: 60ch; }

.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 680px) { .panels { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.panel h2 { margin: 0; font-size: 17px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.panel h2 code { font-family: var(--font-code); font-size: 15px; }
.kind { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; }
.free .kind { background: var(--value-soft); color: var(--value); }
.attached .kind { background: var(--shared-soft); color: var(--shared); }
svg { width: 100%; height: auto; display: block; }
.code {
  font: 13px/1.5 var(--font-code); background: var(--code-bg); border-radius: 10px; padding: 8px 12px;
  min-height: 3.4em; overflow-x: auto; white-space: pre;
}
.caption { margin: 0; font-weight: 500; min-height: 2.8em; }

.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.6; }
.free .box.lit { fill: var(--value-soft); stroke: var(--value); stroke-width: 2; }
.attached .box.lit { fill: var(--shared-soft); stroke: var(--shared); stroke-width: 2; }
.sandbox { fill: var(--changed-soft); stroke: var(--changed); stroke-width: 1.6; stroke-dasharray: 5 4; }
.lbl { font-family: var(--font-body); font-size: 12px; font-weight: 600; fill: var(--ink); }
.sub { font-family: var(--font-code); font-size: 11px; fill: var(--muted); }
.badge { font-family: var(--font-body); font-size: 10px; font-weight: 600; fill: var(--changed); }
.flow { fill: none; stroke: var(--muted); stroke-width: 2; }
.free .flow.on { stroke: var(--value); }
.attached .flow.on { stroke: var(--shared); }
.step-item { opacity: 0.25; }
.step-item.on { opacity: 1; }
@media (prefers-reduced-motion: no-preference) {
  .step-item, .box, .flow { transition: opacity .35s ease, fill .3s ease, stroke .3s ease; }
}

.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
.bar button {
  font: 600 15px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 9px 18px; cursor: pointer; min-height: 44px;
}
.bar button.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.bar button:disabled { opacity: .4; cursor: default; }
.bar button:focus-visible, .dots button:focus-visible, summary:focus-visible { outline: 3px solid var(--shared); outline-offset: 2px; }
.dots { display: flex; gap: 8px; }
.dots button { width: 14px; height: 14px; min-height: 0; padding: 0; border-radius: 50%; border: 2px solid var(--ink); background: transparent; }
.dots button[aria-current="step"] { background: var(--ink); }
.count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 6.5em; text-align: center; }

details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
summary { cursor: pointer; font-weight: 600; }
details ol { margin: 10px 0 0; padding-left: 22px; display: grid; gap: 10px; }
details li p { margin: 0; }
details code { font-family: var(--font-code); font-size: 14px; background: var(--code-bg); padding: 1px 6px; border-radius: 6px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Senior · Swift Language · Macros</p>
    <h1>How Swift macros expand at compile time</h1>
    <p class="lede">Step through how the compiler turns freestanding (#) and attached (@) macros into type-checked Swift code.</p>
  </header>

  <figure class="panels" id="figure" role="img" aria-label="Two panels comparing freestanding macros with # and attached macros with @ as they pass through syntax parsing, a sandboxed SwiftSyntax plugin, code expansion, and type checking." style="margin:0">
    <section class="panel free" aria-hidden="true">
      <h2><code>#Predicate</code> <span class="kind">freestanding</span></h2>
      <svg viewBox="0 0 340 245">
        <defs>
          <marker id="arr-f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill: var(--value)"/></marker>
        </defs>
        <g class="step-item on" id="f-1">
          <rect class="box lit" x="18" y="10" width="304" height="44" rx="10"/>
          <text class="lbl" x="32" y="29">1. Source syntax tree (AST)</text>
          <text class="sub" x="32" y="45">#Predicate&lt;Product&gt; { $0.price &lt; 50 }</text>
        </g>
        <path class="flow" id="f-a1" d="M170 54 V74" marker-end="url(#arr-f)"/>
        <g class="step-item" id="f-2">
          <rect class="sandbox" x="18" y="76" width="304" height="48" rx="10"/>
          <text class="lbl" x="32" y="96">2. Sandboxed SwiftSyntax plugin</text>
          <text class="badge" x="225" y="96">no disk / net</text>
          <text class="sub" x="32" y="113">Reads macro node only</text>
        </g>
        <path class="flow" id="f-a2" d="M170 124 V144" marker-end="url(#arr-f)"/>
        <g class="step-item" id="f-3">
          <rect class="box" id="f-b3" x="18" y="146" width="304" height="44" rx="10"/>
          <text class="lbl" x="32" y="165">3. Generated expression</text>
          <text class="sub" x="32" y="181">Predicate&lt;Product&gt; { ... }</text>
        </g>
        <path class="flow" id="f-a3" d="M170 190 V206" marker-end="url(#arr-f)"/>
        <g class="step-item" id="f-4">
          <rect class="box" id="f-b4" x="18" y="208" width="304" height="30" rx="8"/>
          <text class="lbl" x="32" y="227">4. Compiler type-checks final result</text>
        </g>
      </svg>
      <div class="code" id="f-code"></div>
      <p class="caption" id="f-cap"></p>
    </section>

    <section class="panel attached" aria-hidden="true">
      <h2><code>@Observable</code> <span class="kind">attached</span></h2>
      <svg viewBox="0 0 340 245">
        <defs>
          <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill: var(--shared)"/></marker>
        </defs>
        <g class="step-item on" id="a-1">
          <rect class="box lit" x="18" y="10" width="304" height="44" rx="10"/>
          <text class="lbl" x="32" y="29">1. Attached class syntax tree</text>
          <text class="sub" x="32" y="45">@Observable class Cart { var count = 0 }</text>
        </g>
        <path class="flow" id="a-a1" d="M170 54 V74" marker-end="url(#arr-a)"/>
        <g class="step-item" id="a-2">
          <rect class="sandbox" x="18" y="76" width="304" height="48" rx="10"/>
          <text class="lbl" x="32" y="96">2. Sandboxed SwiftSyntax plugin</text>
          <text class="badge" x="225" y="96">additive only</text>
          <text class="sub" x="32" y="113">Expands member + memberAttribute + ext</text>
        </g>
        <path class="flow" id="a-a2" d="M170 124 V144" marker-end="url(#arr-a)"/>
        <g class="step-item" id="a-3">
          <rect class="box" id="a-b3" x="18" y="146" width="304" height="44" rx="10"/>
          <text class="lbl" x="32" y="165">3. Added members and conformance</text>
          <text class="sub" x="32" y="181">@ObservationTracked + extension Observable</text>
        </g>
        <path class="flow" id="a-a3" d="M170 190 V206" marker-end="url(#arr-a)"/>
        <g class="step-item" id="a-4">
          <rect class="box" id="a-b4" x="18" y="208" width="304" height="30" rx="8"/>
          <text class="lbl" x="32" y="227">4. Compiler type-checks class and callers</text>
        </g>
      </svg>
      <div class="code" id="a-code"></div>
      <p class="caption" id="a-cap"></p>
    </section>
  </figure>

  <p class="sr-only" id="live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></p>

  <nav class="bar" aria-label="Diagram steps">
    <button type="button" id="back">Back</button>
    <div class="dots" id="dots"></div>
    <span class="count" id="count"></span>
    <button type="button" id="next" class="primary">Next</button>
    <button type="button" id="replay">Replay</button>
  </nav>

  <details id="all">
    <summary>All steps as a list</summary>
    <ol id="list"></ol>
  </details>
  <p class="note">Use the arrow keys to move between steps.</p>
</div>

<script>
const STEPS = [
  {
    f: { code: "let p = #Predicate<Product> { $0.price < 50 }", cap: "Step 1: Swift parses the # macro call into a syntax tree." },
    a: { code: "@Observable class Cart { var count = 0 }", cap: "Step 1: Swift parses @Observable and the Cart class syntax." }
  },
  {
    f: { code: "#externalMacro(module: \"FoundationMacros\", ...)", cap: "Step 2: The sandboxed plugin inspects only the macro node." },
    a: { code: "@attached(member) @attached(memberAttribute)", cap: "Step 2: The plugin runs without disk or network access." }
  },
  {
    f: { code: "// expands to Predicate<Product> builder", cap: "Step 3: The plugin returns a new type-safe expression." },
    a: { code: "@ObservationTracked var count = 0", cap: "Step 3: The plugin adds storage, attributes, and Observable." }
  },
  {
    f: { code: "try p.evaluate(item) // returns Bool", cap: "Step 4: The compiler type-checks the expanded expression." },
    a: { code: "let c = Cart(); c.count = 2", cap: "Step 4: The compiler checks the expanded class and callers." }
  }
];

const $ = (id) => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
let step = 0;

function render() {
  const n = step + 1;
  for (let i = 1; i <= 4; i++) {
    $("f-" + i).classList.toggle("on", n >= i);
    $("a-" + i).classList.toggle("on", n >= i);
  }
  for (let i = 1; i <= 3; i++) {
    $("f-a" + i).classList.toggle("on", n >= i + 1);
    $("a-a" + i).classList.toggle("on", n >= i + 1);
  }
  $("f-b3").classList.toggle("lit", n === 3);
  $("a-b3").classList.toggle("lit", n === 3);
  $("f-b4").classList.toggle("lit", n === 4);
  $("a-b4").classList.toggle("lit", n === 4);

  const st = STEPS[step];
  $("f-code").textContent = st.f.code;
  $("a-code").textContent = st.a.code;
  $("f-cap").textContent = st.f.cap;
  $("a-cap").textContent = st.a.cap;
  $("count").textContent = "Step " + n + " of " + STEPS.length;
  $("live").textContent = "Step " + n + ". Freestanding: " + st.f.cap + " Attached: " + st.a.cap;
  $("back").disabled = step === 0;
  $("next").disabled = step === STEPS.length - 1;
  [...$("dots").children].forEach((d, i) => i === step ? d.setAttribute("aria-current", "step") : d.removeAttribute("aria-current"));
}

function go(i) { step = Math.max(0, Math.min(STEPS.length - 1, i)); render(); }

STEPS.forEach((st, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.setAttribute("aria-label", "Diagram step " + (i + 1) + " of " + STEPS.length);
  b.addEventListener("click", () => go(i));
  $("dots").append(b);
  const li = document.createElement("li");
  li.innerHTML = "<p><b>Freestanding:</b> <code></code> — <span></span></p><p><b>Attached:</b> <code></code> — <span></span></p>";
  const [c1, c2] = li.querySelectorAll("code");
  const [t1, t2] = li.querySelectorAll("span");
  c1.textContent = st.f.code; t1.textContent = st.f.cap;
  c2.textContent = st.a.code; t2.textContent = st.a.cap;
  $("list").append(li);
});

$("back").addEventListener("click", () => go(step - 1));
$("next").addEventListener("click", () => go(step + 1));
$("replay").addEventListener("click", () => {
  go(0);
  if (reduce.matches) return;
  let i = 0;
  const t = setInterval(() => { i++; go(i); if (i >= STEPS.length - 1) clearInterval(t); }, 1100);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") go(step + 1);
  if (e.key === "ArrowLeft") go(step - 1);
});

if (reduce.matches) { step = STEPS.length - 1; $("all").open = true; }
render();
</script>
</body>
</html>
