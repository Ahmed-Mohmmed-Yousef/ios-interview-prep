<title>Mobile System Design Interview Flow Diagram</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #f5f7fb; --surface: #ffffff; --ink: #172033; --muted: #5a6478; --line: #c9d1df;
  --value: #0f7f63; --value-soft: #dcf2ea;
  --shared: #6447d1; --shared-soft: #ebe6fb;
  --changed: #a76a12; --changed-soft: #fcefd6;
  --code-bg: #eef1f7;
  --font-body: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141c; --surface: #171e29; --ink: #e6ebf2; --muted: #9aa5b8;
  --line: #3a4658; --value: #45cfa3; --value-soft: #13362c; --shared: #a690ff; --shared-soft: #251f42;
  --changed: #f2c14e; --changed-soft: #3a2e12; --code-bg: #111821; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f141c; --surface: #171e29; --ink: #e6ebf2; --muted: #9aa5b8;
  --line: #3a4658; --value: #45cfa3; --value-soft: #13362c; --shared: #a690ff; --shared-soft: #251f42;
  --changed: #f2c14e; --changed-soft: #3a2e12; --code-bg: #111821; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 900px; margin: 0 auto; display: grid; gap: 20px; }
.eyebrow { font-size: 13px; font-weight: 500; letter-spacing: 0.04em; color: var(--muted); margin: 0; }
h1 { font-size: clamp(24px, 4.4vw, 34px); line-height: 1.15; margin: 4px 0 6px; text-wrap: balance; font-weight: 700; }
.lede { margin: 0; color: var(--muted); max-width: 60ch; }

.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 680px) { .panels { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.panel h2 { margin: 0; font-size: 17px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.kind { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; }
.rush .kind { background: var(--changed-soft); color: var(--changed); }
.plan .kind { background: var(--value-soft); color: var(--value); }
svg { width: 100%; height: auto; display: block; }
.code {
  font: 13px/1.45 var(--font-code); background: var(--code-bg); border-radius: 10px; padding: 8px 12px;
  min-height: 3.2em; overflow-x: auto; white-space: pre;
}
.caption { margin: 0; font-weight: 500; min-height: 2.6em; }

.stage-box { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; transition: opacity .35s ease, fill .35s ease, stroke .35s ease; }
.stage-label { font-family: var(--font-body); font-size: 12px; font-weight: 600; fill: var(--ink); }
.stage-sub { font-family: var(--font-code); font-size: 11px; fill: var(--muted); }
.rush .stage-box.active { fill: var(--changed-soft); stroke: var(--changed); stroke-width: 2; }
.plan .stage-box.active { fill: var(--value-soft); stroke: var(--value); stroke-width: 2; }
.dim { opacity: 0.28; }

.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
.bar button {
  font: 600 15px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 9px 18px; cursor: pointer; min-height: 44px;
}
.bar button.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.bar button:disabled { opacity: .4; cursor: default; }
.bar button:focus-visible, .dots button:focus-visible, summary:focus-visible { outline: 3px solid var(--shared); outline-offset: 2px; }
.dots { display: flex; gap: 8px; }
.dots button { width: 14px; height: 14px; min-height: 0; padding: 0; border-radius: 50%; border: 2px solid var(--ink); background: transparent; }
.dots button[aria-current="step"] { background: var(--ink); }
.count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 6.5em; text-align: center; }

details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
summary { cursor: pointer; font-weight: 600; }
details ol { margin: 10px 0 0; padding-left: 22px; display: grid; gap: 10px; }
details li p { margin: 0; }
details code { font-family: var(--font-code); font-size: 13px; background: var(--code-bg); padding: 1px 6px; border-radius: 6px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Mid · Mobile System Design · Diagram</p>
    <h1>45-Minute Interview: Rushed vs Structured</h1>
    <p class="lede">Step through how time-boxing five phases keeps your design focused on real mobile constraints.</p>
  </header>

  <figure class="panels" id="figure" role="img" aria-label="Two panels comparing a rushed interview and a structured five-step interview over 45 minutes. Left: jumping into code without scoping wastes time and misses trade-offs. Right: clarifying scope, designing client layers, deep diving, and reviewing trade-offs finishes cleanly." style="margin:0">
    <section class="panel rush" aria-hidden="true">
      <h2>Unstructured <span class="kind">runs out of time</span></h2>
      <svg viewBox="0 0 340 230">
        <g id="ru-1" class="dim">
          <rect class="stage-box" id="ru-b1" x="16" y="16" width="308" height="42" rx="10"/>
          <text class="stage-label" x="28" y="34">0–15 min: Jump straight to UI boxes</text>
          <text class="stage-sub" x="28" y="49">Wrong scope; missed offline need</text>
        </g>
        <g id="ru-2" class="dim">
          <rect class="stage-box" id="ru-b2" x="16" y="70" width="308" height="42" rx="10"/>
          <text class="stage-label" x="28" y="88">15–32 min: Talk only about backend servers</text>
          <text class="stage-sub" x="28" y="103">Skips client cache and memory limits</text>
        </g>
        <g id="ru-3" class="dim">
          <rect class="stage-box" id="ru-b3" x="16" y="124" width="308" height="42" rx="10"/>
          <text class="stage-label" x="28" y="142">32–44 min: Rush pagination details</text>
          <text class="stage-sub" x="28" y="157">No clear protocol boundaries</text>
        </g>
        <g id="ru-4" class="dim">
          <rect class="stage-box" id="ru-b4" x="16" y="178" width="308" height="42" rx="10"/>
          <text class="stage-label" x="28" y="196">45 min: Time runs out</text>
          <text class="stage-sub" x="28" y="211">No trade-offs or monitoring</text>
        </g>
      </svg>
      <div class="code" id="ru-code"></div>
      <p class="caption" id="ru-cap"></p>
    </section>

    <section class="panel plan" aria-hidden="true">
      <h2>5-Step Plan <span class="kind">clear &amp; complete</span></h2>
      <svg viewBox="0 0 340 230">
        <g id="pl-1" class="dim">
          <rect class="stage-box" id="pl-b1" x="16" y="16" width="308" height="42" rx="10"/>
          <text class="stage-label" x="28" y="34">1. Scope (0–8 min)</text>
          <text class="stage-sub" x="28" y="49">Functional + offline + frame goals</text>
        </g>
        <g id="pl-2" class="dim">
          <rect class="stage-box" id="pl-b2" x="16" y="70" width="308" height="42" rx="10"/>
          <text class="stage-label" x="28" y="88">2. Architecture &amp; API (8–22 min)</text>
          <text class="stage-sub" x="28" y="103">View -&gt; ViewModel -&gt; Repository -&gt; Cache/API</text>
        </g>
        <g id="pl-3" class="dim">
          <rect class="stage-box" id="pl-b3" x="16" y="124" width="308" height="42" rx="10"/>
          <text class="stage-label" x="28" y="142">3–4. Deep Dives &amp; Contracts (22–40 min)</text>
          <text class="stage-sub" x="28" y="157">Pagination, image cache, Swift protocols</text>
        </g>
        <g id="pl-4" class="dim">
          <rect class="stage-box" id="pl-b4" x="16" y="178" width="308" height="42" rx="10"/>
          <text class="stage-label" x="28" y="196">5. Wrap-up (40–45 min)</text>
          <text class="stage-sub" x="28" y="211">Trade-offs + MetricKit &amp; crash metrics</text>
        </g>
      </svg>
      <div class="code" id="pl-code"></div>
      <p class="caption" id="pl-cap"></p>
    </section>
  </figure>

  <p class="sr-only" id="live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></p>

  <nav class="bar" aria-label="Diagram steps">
    <button type="button" id="back">Back</button>
    <div class="dots" id="dots"></div>
    <span class="count" id="count"></span>
    <button type="button" id="next" class="primary">Next</button>
    <button type="button" id="replay">Replay</button>
  </nav>

  <details id="all">
    <summary>All steps as a list</summary>
    <ol id="list"></ol>
  </details>
</div>

<script>
const STEPS = [
  {
    r: { code: "// Minute 1: \"Let's use SwiftUI and Alamofire!\"", cap: "Jumping into tools without asking questions risks solving the wrong problem." },
    p: { code: "// Step 1: What is in scope and out of scope?", cap: "Agree on core features, offline needs, and performance goals first." }
  },
  {
    r: { code: "// Minute 18: Drawing backend database shards", cap: "Spending too much time on server internals leaves no room for iOS layers." },
    p: { code: "protocol FeedRepository: Sendable { ... }", cap: "Sketch API endpoints and client layers with a single source of truth." }
  },
  {
    r: { code: "// Minute 35: Wait, how do images fit in RAM?", cap: "Late surprises force messy changes because caching was never planned." },
    p: { code: "func loadPage(cursor: String?) async throws", cap: "Deep dive on cursor pagination, image caching, and clean Swift contracts." }
  },
  {
    r: { code: "// Minute 45: Time is up!", cap: "The interview ends before discussing battery or memory trade-offs." },
    p: { code: "// Step 5: Polling vs WebSockets trade-off", cap: "Finish with clear trade-offs and production monitoring checks." }
  }
];
const $ = (id) => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
let step = 0;

function render() {
  const n = step + 1;
  for (let i = 1; i <= 4; i++) {
    $("ru-" + i).classList.toggle("dim", n < i);
    $("pl-" + i).classList.toggle("dim", n < i);
    $("ru-b" + i).classList.toggle("active", n === i);
    $("pl-b" + i).classList.toggle("active", n === i);
  }
  const st = STEPS[step];
  $("ru-code").textContent = st.r.code;
  $("pl-code").textContent = st.p.code;
  $("ru-cap").textContent = st.r.cap;
  $("pl-cap").textContent = st.p.cap;
  $("count").textContent = "Step " + n + " of " + STEPS.length;
  $("live").textContent = "Step " + n + ". Rushed: " + st.r.cap + " Structured: " + st.p.cap;
  $("back").disabled = step === 0;
  $("next").disabled = step === STEPS.length - 1;
  [...$("dots").children].forEach((d, i) => i === step ? d.setAttribute("aria-current", "step") : d.removeAttribute("aria-current"));
}

function go(i) { step = Math.max(0, Math.min(STEPS.length - 1, i)); render(); }

STEPS.forEach((st, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.setAttribute("aria-label", "Diagram step " + (i + 1) + " of " + STEPS.length);
  b.addEventListener("click", () => go(i));
  $("dots").append(b);
  const li = document.createElement("li");
  li.innerHTML = "<p><b>Rushed:</b> <code></code> — <span></span></p><p><b>Structured:</b> <code></code> — <span></span></p>";
  const [c1, c2] = li.querySelectorAll("code"), [t1, t2] = li.querySelectorAll("span");
  c1.textContent = st.r.code; t1.textContent = st.r.cap;
  c2.textContent = st.p.code; t2.textContent = st.p.cap;
  $("list").append(li);
});
$("back").addEventListener("click", () => go(step - 1));
$("next").addEventListener("click", () => go(step + 1));
$("replay").addEventListener("click", () => {
  go(0);
  if (reduce.matches) return;
  let i = 0;
  const t = setInterval(() => { i++; go(i); if (i >= STEPS.length - 1) clearInterval(t); }, 1100);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") go(step + 1);
  if (e.key === "ArrowLeft") go(step - 1);
});

if (reduce.matches) { step = STEPS.length - 1; $("all").open = true; }
render();
</script>
