<title>Keeping the UI Smooth Diagram</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #f5f7fb; --surface: #ffffff; --ink: #172033; --muted: #5a6478; --line: #c9d1df;
  --value: #0f7f63; --value-soft: #dcf2ea;
  --shared: #6447d1; --shared-soft: #ebe6fb;
  --changed: #a76a12; --changed-soft: #fcefd6;
  --code-bg: #eef1f7;
  --font-body: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141c; --surface: #171e29; --ink: #e6ebf2; --muted: #9aa5b8;
  --line: #3a4658; --value: #45cfa3; --value-soft: #13362c; --shared: #a690ff; --shared-soft: #251f42;
  --changed: #f2c14e; --changed-soft: #3a2e12; --code-bg: #111821; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f141c; --surface: #171e29; --ink: #e6ebf2; --muted: #9aa5b8;
  --line: #3a4658; --value: #45cfa3; --value-soft: #13362c; --shared: #a690ff; --shared-soft: #251f42;
  --changed: #f2c14e; --changed-soft: #3a2e12; --code-bg: #111821; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 900px; margin: 0 auto; display: grid; gap: 20px; }
.eyebrow { font-size: 13px; font-weight: 500; letter-spacing: 0.04em; color: var(--muted); margin: 0; }
h1 { font-size: clamp(24px, 4.4vw, 34px); line-height: 1.15; margin: 4px 0 6px; text-wrap: balance; font-weight: 700; }
.lede { margin: 0; color: var(--muted); max-width: 60ch; }

.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 680px) { .panels { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.panel h2 { margin: 0; font-size: 17px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.kind { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; }
.hitch .kind { background: var(--changed-soft); color: var(--changed); }
.smooth .kind { background: var(--value-soft); color: var(--value); }
svg { width: 100%; height: auto; display: block; }
.code {
  font: 13px/1.45 var(--font-code); background: var(--code-bg); border-radius: 10px; padding: 8px 12px;
  min-height: 3.2em; overflow-x: auto; white-space: pre;
}
.caption { margin: 0; font-weight: 500; min-height: 2.6em; }

.stage-box { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; transition: opacity .35s ease, fill .35s ease, stroke .35s ease; }
.stage-label { font-family: var(--font-body); font-size: 12px; font-weight: 600; fill: var(--ink); }
.stage-sub { font-family: var(--font-code); font-size: 11px; fill: var(--muted); }
.hitch .stage-box.active { fill: var(--changed-soft); stroke: var(--changed); stroke-width: 2; }
.smooth .stage-box.active { fill: var(--value-soft); stroke: var(--value); stroke-width: 2; }
.dim { opacity: 0.28; }
.deadline { stroke: var(--shared); stroke-width: 1.5; stroke-dasharray: 4 4; }
.deadline-label { font-family: var(--font-code); font-size: 11px; fill: var(--shared); font-weight: 600; }

.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
.bar button {
  font: 600 15px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 9px 18px; cursor: pointer; min-height: 44px;
}
.bar button.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.bar button:disabled { opacity: .4; cursor: default; }
.bar button:focus-visible, .dots button:focus-visible, summary:focus-visible { outline: 3px solid var(--shared); outline-offset: 2px; }
.dots { display: flex; gap: 8px; }
.dots button { width: 14px; height: 14px; min-height: 0; padding: 0; border-radius: 50%; border: 2px solid var(--ink); background: transparent; }
.dots button[aria-current="step"] { background: var(--ink); }
.count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 6.5em; text-align: center; }

details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
summary { cursor: pointer; font-weight: 600; }
details ol { margin: 10px 0 0; padding-left: 22px; display: grid; gap: 10px; }
details li p { margin: 0; }
details code { font-family: var(--font-code); font-size: 13px; background: var(--code-bg); padding: 1px 6px; border-radius: 6px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Mid · Performance · Diagram</p>
    <h1>Render Loop: Commit Hitch vs Smooth Frame</h1>
    <p class="lede">Compare how a slow main-thread image decode misses the 8.33 ms deadline while background work keeps scrolling smooth.</p>
  </header>

  <figure class="panels" id="figure" role="img" aria-label="Two panels showing the four render loop stages: Event, Commit, Render, and Display. Left: decoding an image on the main thread misses the 8.33 ms commit deadline and causes a hitch. Right: decoding off the main thread meets the deadline for a smooth frame." style="margin:0">
    <section class="panel hitch" aria-hidden="true">
      <h2>Slow Main Thread <span class="kind">hitch</span></h2>
      <svg viewBox="0 0 340 220">
        <line class="deadline" x1="175" y1="14" x2="175" y2="190"/>
        <text class="deadline-label" x="175" y="206" text-anchor="middle">8.33 ms commit deadline</text>

        <g id="hi-1" class="dim">
          <rect class="stage-box" id="hi-b1" x="16" y="20" width="76" height="44" rx="10"/>
          <text class="stage-label" x="26" y="39">1. Event</text>
          <text class="stage-sub" x="26" y="55">scroll</text>
        </g>
        <g id="hi-2" class="dim">
          <rect class="stage-box" id="hi-b2" x="100" y="20" width="160" height="44" rx="10"/>
          <text class="stage-label" x="110" y="39">2. Commit (14 ms)</text>
          <text class="stage-sub" x="110" y="55">decode on main</text>
        </g>
        <g id="hi-3" class="dim">
          <rect class="stage-box" id="hi-b3" x="100" y="84" width="110" height="44" rx="10"/>
          <text class="stage-label" x="110" y="103">3. Render</text>
          <text class="stage-sub" x="110" y="119">GPU late</text>
        </g>
        <g id="hi-4" class="dim">
          <rect class="stage-box" id="hi-b4" x="218" y="84" width="106" height="44" rx="10"/>
          <text class="stage-label" x="228" y="103">4. Display</text>
          <text class="stage-sub" x="228" y="119">old frame</text>
        </g>
      </svg>
      <div class="code" id="hi-code"></div>
      <p class="caption" id="hi-cap"></p>
    </section>

    <section class="panel smooth" aria-hidden="true">
      <h2>Offloaded Work <span class="kind">120 fps</span></h2>
      <svg viewBox="0 0 340 220">
        <line class="deadline" x1="175" y1="14" x2="175" y2="190"/>
        <text class="deadline-label" x="175" y="206" text-anchor="middle">8.33 ms commit deadline</text>

        <g id="sm-1" class="dim">
          <rect class="stage-box" id="sm-b1" x="16" y="20" width="76" height="44" rx="10"/>
          <text class="stage-label" x="26" y="39">1. Event</text>
          <text class="stage-sub" x="26" y="55">scroll</text>
        </g>
        <g id="sm-2" class="dim">
          <rect class="stage-box" id="sm-b2" x="100" y="20" width="70" height="44" rx="10"/>
          <text class="stage-label" x="108" y="39">2. Commit</text>
          <text class="stage-sub" x="108" y="55">2.1 ms</text>
        </g>
        <g id="sm-3" class="dim">
          <rect class="stage-box" id="sm-b3" x="184" y="84" width="66" height="44" rx="10"/>
          <text class="stage-label" x="192" y="103">3. GPU</text>
          <text class="stage-sub" x="192" y="119">render</text>
        </g>
        <g id="sm-4" class="dim">
          <rect class="stage-box" id="sm-b4" x="256" y="84" width="68" height="44" rx="10"/>
          <text class="stage-label" x="264" y="103">4. Show</text>
          <text class="stage-sub" x="264" y="119">smooth</text>
        </g>
      </svg>
      <div class="code" id="sm-code"></div>
      <p class="caption" id="sm-cap"></p>
    </section>
  </figure>

  <p class="sr-only" id="live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></p>

  <nav class="bar" aria-label="Diagram steps">
    <button type="button" id="back">Back</button>
    <div class="dots" id="dots"></div>
    <span class="count" id="count"></span>
    <button type="button" id="next" class="primary">Next</button>
    <button type="button" id="replay">Replay</button>
  </nav>

  <details id="all">
    <summary>All steps as a list</summary>
    <ol id="list"></ol>
  </details>
</div>

<script>
const STEPS = [
  {
    h: { code: "// Event: user scrolls list", cap: "Main thread receives the scroll event." },
    s: { code: "// Event: user scrolls list", cap: "Main thread receives the scroll event." }
  },
  {
    h: { code: "imageView.image = UIImage(data: rawData)", cap: "Commit misses the 8.33 ms deadline because decoding runs on main." },
    s: { code: "imageView.image = await photo.byPreparingForDisplay()", cap: "Image was decoded off main, so Commit finishes in 2.1 ms." }
  },
  {
    h: { code: "// Render waits for late commit", cap: "GPU starts late and misses the next screen refresh." },
    s: { code: "layer.shadowPath = UIBezierPath(rect: bounds).cgPath", cap: "GPU renders fast with no offscreen pass." }
  },
  {
    h: { code: "// Result: repeated frame (hitch)", cap: "The old frame stays on screen twice, causing a visible stutter." },
    s: { code: "// Result: fresh frame at 120 Hz", cap: "The new frame reaches the display right on schedule." }
  }
];
const $ = (id) => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
let step = 0;

function render() {
  const n = step + 1;
  for (let i = 1; i <= 4; i++) {
    $("hi-" + i).classList.toggle("dim", n < i);
    $("sm-" + i).classList.toggle("dim", n < i);
    $("hi-b" + i).classList.toggle("active", n === i);
    $("sm-b" + i).classList.toggle("active", n === i);
  }
  const st = STEPS[step];
  $("hi-code").textContent = st.h.code;
  $("sm-code").textContent = st.s.code;
  $("hi-cap").textContent = st.h.cap;
  $("sm-cap").textContent = st.s.cap;
  $("count").textContent = "Step " + n + " of " + STEPS.length;
  $("live").textContent = "Step " + n + ". Slow: " + st.h.cap + " Smooth: " + st.s.cap;
  $("back").disabled = step === 0;
  $("next").disabled = step === STEPS.length - 1;
  [...$("dots").children].forEach((d, i) => i === step ? d.setAttribute("aria-current", "step") : d.removeAttribute("aria-current"));
}

function go(i) { step = Math.max(0, Math.min(STEPS.length - 1, i)); render(); }

STEPS.forEach((st, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.setAttribute("aria-label", "Diagram step " + (i + 1) + " of " + STEPS.length);
  b.addEventListener("click", () => go(i));
  $("dots").append(b);
  const li = document.createElement("li");
  li.innerHTML = "<p><b>Hitch:</b> <code></code> — <span></span></p><p><b>Smooth:</b> <code></code> — <span></span></p>";
  const [c1, c2] = li.querySelectorAll("code"), [t1, t2] = li.querySelectorAll("span");
  c1.textContent = st.h.code; t1.textContent = st.h.cap;
  c2.textContent = st.s.code; t2.textContent = st.s.cap;
  $("list").append(li);
});
$("back").addEventListener("click", () => go(step - 1));
$("next").addEventListener("click", () => go(step + 1));
$("replay").addEventListener("click", () => {
  go(0);
  if (reduce.matches) return;
  let i = 0;
  const t = setInterval(() => { i++; go(i); if (i >= STEPS.length - 1) clearInterval(t); }, 1100);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") go(step + 1);
  if (e.key === "ArrowLeft") go(step - 1);
});

if (reduce.matches) { step = STEPS.length - 1; $("all").open = true; }
render();
</script>
