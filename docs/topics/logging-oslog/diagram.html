<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logging with OSLog: Architecture and Telemetry</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #f5f7fb; --surface: #ffffff; --ink: #172033; --muted: #5a6478; --line: #c9d1df;
  --step1-color: #0284c7; --step1-soft: #e0f2fe;
  --step2-color: #16a34a; --step2-soft: #dcfce7;
  --step3-color: #ea580c; --step3-soft: #ffedd5;
  --step4-color: #7c3aed; --step4-soft: #f5f3ff;
  --code-bg: #eef1f7;
  --font-body: "Lexend", system-ui, -apple-system, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141c; --surface: #171e29; --ink: #e6ebf2; --muted: #9aa5b8;
  --line: #3a4658;
  --step1-color: #38bdf8; --step1-soft: #082f49;
  --step2-color: #4ade80; --step2-soft: #052e16;
  --step3-color: #fb923c; --step3-soft: #431407;
  --step4-color: #a78bfa; --step4-soft: #2e1065;
  --code-bg: #111821; color-scheme: dark;
} }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body);
  margin: 0; padding: 20px;
}
.diagram-host { max-width: 840px; margin: 0 auto; display: grid; gap: 16px; }

.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 640px) { .panels { grid-template-columns: 1fr; } }

.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px; display: grid; gap: 10px; min-width: 0;
}
.panel h3 { margin: 0; font-size: 16px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.kind { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.kind.s1 { background: var(--step1-soft); color: var(--step1-color); }
.kind.s2 { background: var(--step2-soft); color: var(--step2-color); }
.kind.s3 { background: var(--step3-soft); color: var(--step3-color); }
.kind.s4 { background: var(--step4-soft); color: var(--step4-color); }

.code {
  font: 13px/1.5 var(--font-code); background: var(--code-bg); border-radius: 8px;
  padding: 8px 12px; min-height: 4.8em; white-space: pre; overflow-x: auto;
}
.caption { margin: 0; font-size: 14px; font-weight: 500; min-height: 2.8em; }

svg { width: 100%; height: auto; display: block; }
.device-frame { fill: var(--surface); stroke: var(--line); stroke-width: 2; rx: 12px; }
.base-screen { fill: var(--code-bg); }

.stepper {
  display: flex; gap: 12px; align-items: center; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 16px;
}
.step-indicators { display: flex; gap: 8px; }
.step-dot {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  font-size: 12px; font-weight: 600; background: var(--code-bg); color: var(--muted);
  border: 1px solid var(--line); cursor: pointer; transition: all 0.2s;
}
.step-dot.active {
  background: var(--step1-color); color: #ffffff; border-color: var(--step1-color);
}
.btn-group { display: flex; gap: 8px; }
button {
  background: var(--surface); border: 1px solid var(--line); color: var(--ink);
  font: 14px/1 var(--font-body); font-weight: 600; padding: 8px 14px; border-radius: 8px;
  cursor: pointer; transition: background 0.2s, border-color 0.2s;
}
button:hover:not(:disabled) { background: var(--code-bg); border-color: var(--step1-color); }
button:disabled { opacity: 0.4; cursor: not-allowed; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div class="diagram-host" role="region" aria-label="Interactive OSLog Architecture Stepper">
  <div class="panels">
    <div class="panel">
      <h3>
        <span class="kind s1" id="badge">Step 1</span>
        <span id="title">Subsystems & Categories</span>
      </h3>
      <p class="caption" id="desc">
        Reverse-DNS subsystems and specific feature categories structure logs for instant filtering.
      </p>
      <div class="code" id="codeSnippet">let logger = Logger(
  subsystem: "com.prepstops.app",
  category: "networking"
)</div>
    </div>
    <div class="panel">
      <svg viewBox="0 0 320 200" aria-hidden="true">
        <rect x="0" y="0" width="320" height="200" class="device-frame" />
        <g id="visualScene"></g>
      </svg>
    </div>
  </div>

  <div class="stepper">
    <div class="step-indicators" role="tablist">
      <div class="step-dot active" role="tab" aria-selected="true" tabindex="0">1</div>
      <div class="step-dot" role="tab" aria-selected="false" tabindex="0">2</div>
      <div class="step-dot" role="tab" aria-selected="false" tabindex="0">3</div>
      <div class="step-dot" role="tab" aria-selected="false" tabindex="0">4</div>
    </div>
    <div class="btn-group">
      <button id="prevBtn" disabled>Back</button>
      <button id="nextBtn">Next</button>
    </div>
  </div>
</div>

<script>
const steps = [
  {
    step: 1,
    badge: "Step 1",
    badgeClass: "s1",
    title: "Subsystems & Categories",
    desc: "Reverse-DNS subsystems and specific feature categories structure logs for instant filtering in Console.app and Xcode.",
    code: `import os\nlet logger = Logger(\n  subsystem: "com.prepstops.app",\n  category: "networking"\n)`,
    svg: `
      <rect x="25" y="30" width="270" height="40" rx="6" fill="var(--step1-soft)" stroke="var(--step1-color)" stroke-width="2" />
      <text x="160" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="var(--step1-color)">Subsystem: com.prepstops.app</text>

      <line x1="80" y1="70" x2="80" y2="95" stroke="var(--step1-color)" stroke-width="1.5" />
      <line x1="160" y1="70" x2="160" y2="95" stroke="var(--step1-color)" stroke-width="1.5" />
      <line x1="240" y1="70" x2="240" y2="95" stroke="var(--step1-color)" stroke-width="1.5" />

      <rect x="35" y="95" width="90" height="50" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5" />
      <text x="80" y="117" text-anchor="middle" font-size="9" font-weight="700" fill="var(--ink)">auth</text>
      <text x="80" y="132" text-anchor="middle" font-size="8" fill="var(--muted)">Login & Tokens</text>

      <rect x="115" y="95" width="90" height="50" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5" />
      <text x="160" y="117" text-anchor="middle" font-size="9" font-weight="700" fill="var(--ink)">networking</text>
      <text x="160" y="132" text-anchor="middle" font-size="8" fill="var(--muted)">HTTP & APIs</text>

      <rect x="195" y="95" width="90" height="50" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5" />
      <text x="240" y="117" text-anchor="middle" font-size="9" font-weight="700" fill="var(--ink)">database</text>
      <text x="240" y="132" text-anchor="middle" font-size="8" fill="var(--muted)">Local Storage</text>

      <text x="160" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">Structured logging taxonomy</text>
    `
  },
  {
    step: 2,
    badge: "Step 2",
    badgeClass: "s2",
    title: "The 5 Log Levels",
    desc: "Messages progress in severity from high-volume debug logs to info milestones, default notice, error, and critical faults.",
    code: `logger.debug("Parsing item")\nlogger.info("Fetched 10 items")\nlogger.notice("Sync finished")\nlogger.error("404 Not Found")\nlogger.fault("Database corrupt")`,
    svg: `
      <rect x="25" y="40" width="50" height="85" rx="4" fill="var(--code-bg)" stroke="var(--line)" stroke-width="1" />
      <text x="50" y="75" text-anchor="middle" font-size="9" font-weight="600" fill="var(--muted)">debug</text>
      <text x="50" y="105" text-anchor="middle" font-size="7" fill="var(--muted)">Dev only</text>

      <rect x="80" y="40" width="50" height="85" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="1" />
      <text x="105" y="75" text-anchor="middle" font-size="9" font-weight="600" fill="var(--ink)">info</text>
      <text x="105" y="105" text-anchor="middle" font-size="7" fill="var(--muted)">Helpful</text>

      <rect x="135" y="40" width="50" height="85" rx="4" fill="var(--step1-soft)" stroke="var(--step1-color)" stroke-width="1.5" />
      <text x="160" y="75" text-anchor="middle" font-size="9" font-weight="700" fill="var(--step1-color)">notice</text>
      <text x="160" y="105" text-anchor="middle" font-size="7" fill="var(--step1-color)">Default</text>

      <rect x="190" y="40" width="50" height="85" rx="4" fill="var(--step3-soft)" stroke="var(--step3-color)" stroke-width="1.5" />
      <text x="215" y="75" text-anchor="middle" font-size="9" font-weight="700" fill="var(--step3-color)">error</text>
      <text x="215" y="105" text-anchor="middle" font-size="7" fill="var(--step3-color)">Failure</text>

      <rect x="245" y="40" width="50" height="85" rx="4" fill="var(--step2-soft)" stroke="var(--step2-color)" stroke-width="2" />
      <text x="270" y="75" text-anchor="middle" font-size="9" font-weight="700" fill="var(--step2-color)">fault</text>
      <text x="270" y="105" text-anchor="middle" font-size="7" fill="var(--step2-color)">Critical</text>

      <text x="160" y="155" text-anchor="middle" font-size="9" fill="var(--muted)">Increasing severity &rarr;</text>
      <text x="160" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">Severity-based persistence</text>
    `
  },
  {
    step: 3,
    badge: "Step 3",
    badgeClass: "s3",
    title: "Privacy by Default",
    desc: "Dynamic strings and personal data are masked as <private> in release builds. Numbers are public by default.",
    code: `logger.info("Order \\(orderId, privacy: .public)\\n  for \\(email, privacy: .private)")\n// Output in release: Order 42 for <private>`,
    svg: `
      <rect x="25" y="35" width="270" height="115" rx="8" fill="var(--step3-soft)" stroke="var(--step3-color)" stroke-width="2" />
      <text x="160" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="var(--step3-color)">Automated PII Redaction</text>

      <rect x="40" y="70" width="115" height="40" rx="4" fill="var(--surface)" />
      <text x="97" y="87" text-anchor="middle" font-size="9" font-weight="600" fill="var(--ink)">Scalar Number</text>
      <text x="97" y="102" text-anchor="middle" font-size="8" fill="var(--step1-color)">Public by default: 42</text>

      <rect x="165" y="70" width="115" height="40" rx="4" fill="var(--surface)" />
      <text x="222" y="87" text-anchor="middle" font-size="9" font-weight="600" fill="var(--ink)">Dynamic String</text>
      <text x="222" y="102" text-anchor="middle" font-size="8" fill="var(--step3-color)">Private: &lt;private&gt;</text>

      <text x="160" y="134" text-anchor="middle" font-size="9" fill="var(--muted)">Compliance with GDPR & privacy standards</text>
      <text x="160" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">Zero-leak personal information protection</text>
    `
  },
  {
    step: 4,
    badge: "Step 4",
    badgeClass: "s4",
    title: "Console & Diagnostics",
    desc: "Filter live log streams in Console.app and Xcode 15+. Extract recent logs programmatically with OSLogStore.",
    code: `// Live streaming with predicate:\n// subsystem:com.prepstops.app AND level:error\nlet store = try OSLogStore(scope: .currentProcessIdentifier)`,
    svg: `
      <rect x="25" y="35" width="270" height="115" rx="8" fill="var(--step4-soft)" stroke="var(--step4-color)" stroke-width="2" />
      <text x="160" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="var(--step4-color)">Unified Tooling Integration</text>

      <rect x="40" y="70" width="115" height="35" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="1" />
      <text x="97" y="88" text-anchor="middle" font-size="9" font-weight="600" fill="var(--ink)">macOS Console.app</text>
      <text x="97" y="100" text-anchor="middle" font-size="7" fill="var(--muted)">Live device stream</text>

      <rect x="165" y="70" width="115" height="35" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="1" />
      <text x="222" y="88" text-anchor="middle" font-size="9" font-weight="600" fill="var(--ink)">OSLogStore API</text>
      <text x="222" y="100" text-anchor="middle" font-size="7" fill="var(--muted)">Programmatic logs</text>

      <text x="160" y="130" text-anchor="middle" font-size="9" fill="var(--step4-color)">Structured search across all system threads</text>
      <text x="160" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="var(--step4-color)">Complete telemetry lifecycle</text>
    `
  }
];

let curIdx = 0;
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const dots = document.querySelectorAll('.step-dot');
const badge = document.getElementById('badge');
const title = document.getElementById('title');
const desc = document.getElementById('desc');
const codeSnippet = document.getElementById('codeSnippet');
const visualScene = document.getElementById('visualScene');

function render(idx) {
  curIdx = idx;
  const s = steps[idx];
  badge.textContent = s.badge;
  badge.className = 'kind ' + s.badgeClass;
  title.textContent = s.title;
  desc.textContent = s.desc;
  codeSnippet.textContent = s.code;
  visualScene.innerHTML = s.svg;

  dots.forEach((d, i) => {
    const act = i === idx;
    d.classList.toggle('active', act);
    d.setAttribute('aria-selected', act ? 'true' : 'false');
  });

  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === steps.length - 1;
}

prevBtn.addEventListener('click', () => { if (curIdx > 0) render(curIdx - 1); });
nextBtn.addEventListener('click', () => { if (curIdx < steps.length - 1) render(curIdx + 1); });
dots.forEach((d, i) => d.addEventListener('click', () => render(i)));

render(0);
</script>
</body>
</html>
