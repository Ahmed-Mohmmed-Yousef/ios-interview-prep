<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SOLID Basics: Five Architecture Principles in Swift</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #f5f7fb; --surface: #ffffff; --ink: #172033; --muted: #5a6478; --line: #c9d1df;
  --step1-color: #0284c7; --step1-soft: #e0f2fe;
  --step2-color: #16a34a; --step2-soft: #dcfce7;
  --step3-color: #ea580c; --step3-soft: #ffedd5;
  --step4-color: #7c3aed; --step4-soft: #f5f3ff;
  --code-bg: #eef1f7;
  --font-body: "Lexend", system-ui, -apple-system, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141c; --surface: #171e29; --ink: #e6ebf2; --muted: #9aa5b8;
  --line: #3a4658;
  --step1-color: #38bdf8; --step1-soft: #082f49;
  --step2-color: #4ade80; --step2-soft: #052e16;
  --step3-color: #fb923c; --step3-soft: #431407;
  --step4-color: #a78bfa; --step4-soft: #2e1065;
  --code-bg: #111821; color-scheme: dark;
} }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body);
  margin: 0; padding: 20px;
}
.diagram-host { max-width: 840px; margin: 0 auto; display: grid; gap: 16px; }

.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 640px) { .panels { grid-template-columns: 1fr; } }

.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px; display: grid; gap: 10px; min-width: 0;
}
.panel h3 { margin: 0; font-size: 16px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.kind { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.kind.s1 { background: var(--step1-soft); color: var(--step1-color); }
.kind.s2 { background: var(--step2-soft); color: var(--step2-color); }
.kind.s3 { background: var(--step3-soft); color: var(--step3-color); }
.kind.s4 { background: var(--step4-soft); color: var(--step4-color); }

.code {
  font: 13px/1.5 var(--font-code); background: var(--code-bg); border-radius: 8px;
  padding: 8px 12px; min-height: 4.8em; white-space: pre; overflow-x: auto;
}
.caption { margin: 0; font-size: 14px; font-weight: 500; min-height: 2.8em; }

svg { width: 100%; height: auto; display: block; }
.device-frame { fill: var(--surface); stroke: var(--line); stroke-width: 2; rx: 12px; }
.base-screen { fill: var(--code-bg); }

.stepper {
  display: flex; gap: 12px; align-items: center; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 16px;
}
.step-indicators { display: flex; gap: 8px; }
.step-dot {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  font-size: 12px; font-weight: 600; background: var(--code-bg); color: var(--muted);
  border: 1px solid var(--line); cursor: pointer; transition: all 0.2s;
}
.step-dot.active {
  background: var(--step1-color); color: #ffffff; border-color: var(--step1-color);
}
.btn-group { display: flex; gap: 8px; }
button {
  background: var(--surface); border: 1px solid var(--line); color: var(--ink);
  font: 14px/1 var(--font-body); font-weight: 600; padding: 8px 14px; border-radius: 8px;
  cursor: pointer; transition: background 0.2s, border-color 0.2s;
}
button:hover:not(:disabled) { background: var(--code-bg); border-color: var(--step1-color); }
button:disabled { opacity: 0.4; cursor: not-allowed; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div class="diagram-host" role="region" aria-label="Interactive SOLID Basics Stepper">
  <div class="panels">
    <div class="panel">
      <h3>
        <span class="kind s1" id="badge">Step 1</span>
        <span id="title">Single Responsibility (SRP)</span>
      </h3>
      <p class="caption" id="desc">
        A class or struct has only one reason to change, separating networking, persistence, and UI presentation.
      </p>
      <div class="code" id="codeSnippet">// One reason to change
struct UserAuthService { ... }
struct UserDatabaseStore { ... }</div>
    </div>
    <div class="panel">
      <svg viewBox="0 0 320 200" aria-hidden="true">
        <rect x="0" y="0" width="320" height="200" class="device-frame" />
        <g id="visualScene"></g>
      </svg>
    </div>
  </div>

  <div class="stepper">
    <div class="step-indicators" role="tablist">
      <div class="step-dot active" role="tab" aria-selected="true" tabindex="0">1</div>
      <div class="step-dot" role="tab" aria-selected="false" tabindex="0">2</div>
      <div class="step-dot" role="tab" aria-selected="false" tabindex="0">3</div>
      <div class="step-dot" role="tab" aria-selected="false" tabindex="0">4</div>
    </div>
    <div class="btn-group">
      <button id="prevBtn" disabled>Back</button>
      <button id="nextBtn">Next</button>
    </div>
  </div>
</div>

<script>
const steps = [
  {
    step: 1,
    badge: "Step 1",
    badgeClass: "s1",
    title: "Single Responsibility (SRP)",
    desc: "A class or struct has only one reason to change, separating networking, storage, and UI into distinct types.",
    code: `// Distinct cohesive boundaries\nstruct UserAPIService { func fetch() }\nstruct UserStore { func save() }\nfinal class UserView { func render() }`,
    svg: `
      <rect x="25" y="45" width="80" height="100" rx="6" fill="var(--surface)" stroke="var(--step1-color)" stroke-width="1.5" />
      <text x="65" y="70" text-anchor="middle" font-size="10" font-weight="700" fill="var(--step1-color)">APIService</text>
      <text x="65" y="95" text-anchor="middle" font-size="8" fill="var(--muted)">Networking</text>
      <text x="65" y="125" text-anchor="middle" font-size="8" fill="var(--ink)">HTTP Calls</text>

      <rect x="120" y="45" width="80" height="100" rx="6" fill="var(--surface)" stroke="var(--step1-color)" stroke-width="1.5" />
      <text x="160" y="70" text-anchor="middle" font-size="10" font-weight="700" fill="var(--step1-color)">UserStore</text>
      <text x="160" y="95" text-anchor="middle" font-size="8" fill="var(--muted)">Persistence</text>
      <text x="160" y="125" text-anchor="middle" font-size="8" fill="var(--ink)">Disk / DB</text>

      <rect x="215" y="45" width="80" height="100" rx="6" fill="var(--surface)" stroke="var(--step1-color)" stroke-width="1.5" />
      <text x="255" y="70" text-anchor="middle" font-size="10" font-weight="700" fill="var(--step1-color)">UserView</text>
      <text x="255" y="95" text-anchor="middle" font-size="8" fill="var(--muted)">Presentation</text>
      <text x="255" y="125" text-anchor="middle" font-size="8" fill="var(--ink)">UI Layout</text>

      <text x="160" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">One cohesive job per type</text>
    `
  },
  {
    step: 2,
    badge: "Step 2",
    badgeClass: "s2",
    title: "Open/Closed (OCP)",
    desc: "Open for extension, closed for modification. Add new behaviors by conforming to protocols without editing old code.",
    code: `protocol PaymentMethod { func pay() }\nstruct ApplePay: PaymentMethod { ... }\nstruct Klarna: PaymentMethod { ... }`,
    svg: `
      <rect x="100" y="30" width="120" height="40" rx="6" fill="var(--step2-soft)" stroke="var(--step2-color)" stroke-width="2" />
      <text x="160" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="var(--step2-color)">&laquo;PaymentMethod&raquo;</text>

      <line x1="130" y1="70" x2="65" y2="105" stroke="var(--step2-color)" stroke-width="1.5" />
      <line x1="160" y1="70" x2="160" y2="105" stroke="var(--step2-color)" stroke-width="1.5" />
      <line x1="190" y1="70" x2="255" y2="105" stroke="var(--step2-color)" stroke-width="1.5" stroke-dasharray="3,3" />

      <rect x="25" y="105" width="80" height="40" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5" />
      <text x="65" y="130" text-anchor="middle" font-size="9" font-weight="600" fill="var(--ink)">CreditCard</text>

      <rect x="120" y="105" width="80" height="40" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5" />
      <text x="160" y="130" text-anchor="middle" font-size="9" font-weight="600" fill="var(--ink)">ApplePay</text>

      <rect x="215" y="105" width="80" height="40" rx="4" fill="var(--step2-soft)" stroke="var(--step2-color)" stroke-width="1.5" />
      <text x="255" y="130" text-anchor="middle" font-size="9" font-weight="700" fill="var(--step2-color)">New Provider</text>

      <text x="160" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">Extend with new types, do not edit old code</text>
    `
  },
  {
    step: 3,
    badge: "Step 3",
    badgeClass: "s3",
    title: "Interface Segregation (ISP)",
    desc: "Clients should not depend on methods they do not use. Compose small, focused protocols instead of monolithic ones.",
    code: `protocol Feedable { func eat() }\nprotocol Workable { func work() }\ntypealias Person = Feedable & Workable`,
    svg: `
      <rect x="30" y="35" width="115" height="45" rx="6" fill="var(--step3-soft)" stroke="var(--step3-color)" stroke-width="1.5" />
      <text x="87" y="55" text-anchor="middle" font-size="10" font-weight="700" fill="var(--step3-color)">&laquo;Readable&raquo;</text>
      <text x="87" y="70" text-anchor="middle" font-size="8" fill="var(--ink)">func read()</text>

      <rect x="175" y="35" width="115" height="45" rx="6" fill="var(--step3-soft)" stroke="var(--step3-color)" stroke-width="1.5" />
      <text x="232" y="55" text-anchor="middle" font-size="10" font-weight="700" fill="var(--step3-color)">&laquo;Writable&raquo;</text>
      <text x="232" y="70" text-anchor="middle" font-size="8" fill="var(--ink)">func write()</text>

      <line x1="87" y1="80" x2="135" y2="115" stroke="var(--step3-color)" stroke-width="1.5" />
      <line x1="232" y1="80" x2="185" y2="115" stroke="var(--step3-color)" stroke-width="1.5" />

      <rect x="100" y="115" width="120" height="40" rx="6" fill="var(--surface)" stroke="var(--step3-color)" stroke-width="2" />
      <text x="160" y="135" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)">FileHandler</text>
      <text x="160" y="148" text-anchor="middle" font-size="8" fill="var(--step3-color)">Readable & Writable</text>

      <text x="160" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">Compose focused protocols as needed</text>
    `
  },
  {
    step: 4,
    badge: "Step 4",
    badgeClass: "s4",
    title: "Dependency Inversion (DIP)",
    desc: "High-level modules depend on protocol abstractions, not concrete details. Inject mocks for fast, isolated unit testing.",
    code: `// Depend on abstraction\nclass ViewModel {\n  init(loader: UserLoader) { ... }\n}\n// Inject mock in tests`,
    svg: `
      <rect x="100" y="30" width="120" height="35" rx="6" fill="var(--step4-soft)" stroke="var(--step4-color)" stroke-width="2" />
      <text x="160" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="var(--step4-color)">ViewModel</text>

      <line x1="160" y1="65" x2="160" y2="90" stroke="var(--step4-color)" stroke-width="1.5" />

      <rect x="85" y="90" width="150" height="30" rx="4" fill="var(--surface)" stroke="var(--step4-color)" stroke-width="1.5" stroke-dasharray="3,3" />
      <text x="160" y="110" text-anchor="middle" font-size="10" font-weight="700" fill="var(--step4-color)">&laquo;UserLoader Protocol&raquo;</text>

      <line x1="120" y1="120" x2="75" y2="135" stroke="var(--step4-color)" stroke-width="1" />
      <line x1="200" y1="120" x2="245" y2="135" stroke="var(--step4-color)" stroke-width="1" />

      <rect x="25" y="135" width="100" height="28" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="1" />
      <text x="75" y="153" text-anchor="middle" font-size="8" fill="var(--muted)">ProductionAPI</text>

      <rect x="195" y="135" width="100" height="28" rx="4" fill="var(--step4-soft)" stroke="var(--step4-color)" stroke-width="1.5" />
      <text x="245" y="153" text-anchor="middle" font-size="8" font-weight="700" fill="var(--step4-color)">MockLoader (Test)</text>

      <text x="160" y="185" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">Depend on abstractions, not concretions</text>
    `
  }
];

let curIdx = 0;
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const dots = document.querySelectorAll('.step-dot');
const badge = document.getElementById('badge');
const title = document.getElementById('title');
const desc = document.getElementById('desc');
const codeSnippet = document.getElementById('codeSnippet');
const visualScene = document.getElementById('visualScene');

function render(idx) {
  curIdx = idx;
  const s = steps[idx];
  badge.textContent = s.badge;
  badge.className = 'kind ' + s.badgeClass;
  title.textContent = s.title;
  desc.textContent = s.desc;
  codeSnippet.textContent = s.code;
  visualScene.innerHTML = s.svg;

  dots.forEach((d, i) => {
    const act = i === idx;
    d.classList.toggle('active', act);
    d.setAttribute('aria-selected', act ? 'true' : 'false');
  });

  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === steps.length - 1;
}

prevBtn.addEventListener('click', () => { if (curIdx > 0) render(curIdx - 1); });
nextBtn.addEventListener('click', () => { if (curIdx < steps.length - 1) render(curIdx + 1); });
dots.forEach((d, i) => d.addEventListener('click', () => render(i)));

render(0);
</script>
</body>
</html>
