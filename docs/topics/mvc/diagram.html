<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MVC and Its Problems: The Massive View Controller Architecture</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #f5f7fb; --surface: #ffffff; --ink: #172033; --muted: #5a6478; --line: #c9d1df;
  --step1-color: #0284c7; --step1-soft: #e0f2fe;
  --step2-color: #dc2626; --step2-soft: #fee2e2;
  --step3-color: #ea580c; --step3-soft: #ffedd5;
  --step4-color: #16a34a; --step4-soft: #dcfce7;
  --code-bg: #eef1f7;
  --font-body: "Lexend", system-ui, -apple-system, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141c; --surface: #171e29; --ink: #e6ebf2; --muted: #9aa5b8;
  --line: #3a4658;
  --step1-color: #38bdf8; --step1-soft: #082f49;
  --step2-color: #f87171; --step2-soft: #450a0a;
  --step3-color: #fb923c; --step3-soft: #431407;
  --step4-color: #4ade80; --step4-soft: #052e16;
  --code-bg: #111821; color-scheme: dark;
} }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body);
  margin: 0; padding: 20px;
}
.diagram-host { max-width: 840px; margin: 0 auto; display: grid; gap: 16px; }

.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 640px) { .panels { grid-template-columns: 1fr; } }

.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px; display: grid; gap: 10px; min-width: 0;
}
.panel h3 { margin: 0; font-size: 16px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.kind { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.kind.s1 { background: var(--step1-soft); color: var(--step1-color); }
.kind.s2 { background: var(--step2-soft); color: var(--step2-color); }
.kind.s3 { background: var(--step3-soft); color: var(--step3-color); }
.kind.s4 { background: var(--step4-soft); color: var(--step4-color); }

.code {
  font: 13px/1.5 var(--font-code); background: var(--code-bg); border-radius: 8px;
  padding: 8px 12px; min-height: 4.8em; white-space: pre; overflow-x: auto;
}
.caption { margin: 0; font-size: 14px; font-weight: 500; min-height: 2.8em; }

svg { width: 100%; height: auto; display: block; }
.device-frame { fill: var(--surface); stroke: var(--line); stroke-width: 2; rx: 12px; }
.base-screen { fill: var(--code-bg); }

.stepper {
  display: flex; gap: 12px; align-items: center; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 16px;
}
.step-indicators { display: flex; gap: 8px; }
.step-dot {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  font-size: 12px; font-weight: 600; background: var(--code-bg); color: var(--muted);
  border: 1px solid var(--line); cursor: pointer; transition: all 0.2s;
}
.step-dot.active {
  background: var(--step1-color); color: #ffffff; border-color: var(--step1-color);
}
.btn-group { display: flex; gap: 8px; }
button {
  background: var(--surface); border: 1px solid var(--line); color: var(--ink);
  font: 14px/1 var(--font-body); font-weight: 600; padding: 8px 14px; border-radius: 8px;
  cursor: pointer; transition: background 0.2s, border-color 0.2s;
}
button:hover:not(:disabled) { background: var(--code-bg); border-color: var(--step1-color); }
button:disabled { opacity: 0.4; cursor: not-allowed; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div class="diagram-host" role="region" aria-label="Interactive MVC Architecture Stepper">
  <div class="panels">
    <div class="panel">
      <h3>
        <span class="kind s1" id="badge">Step 1</span>
        <span id="title">Cocoa MVC Mediation Flow</span>
      </h3>
      <p class="caption" id="desc">
        The Controller acts as the mediator. The Model and View never communicate directly.
      </p>
      <div class="code" id="codeSnippet">// Model: pure data
// View: dumb presentation
// Controller: coordinator</div>
    </div>
    <div class="panel">
      <svg viewBox="0 0 320 200" aria-hidden="true">
        <rect x="0" y="0" width="320" height="200" class="device-frame" />
        <g id="visualScene"></g>
      </svg>
    </div>
  </div>

  <div class="stepper">
    <div class="step-indicators" role="tablist">
      <div class="step-dot active" role="tab" aria-selected="true" tabindex="0">1</div>
      <div class="step-dot" role="tab" aria-selected="false" tabindex="0">2</div>
      <div class="step-dot" role="tab" aria-selected="false" tabindex="0">3</div>
      <div class="step-dot" role="tab" aria-selected="false" tabindex="0">4</div>
    </div>
    <div class="btn-group">
      <button id="prevBtn" disabled>Back</button>
      <button id="nextBtn">Next</button>
    </div>
  </div>
</div>

<script>
const steps = [
  {
    step: 1,
    badge: "Step 1",
    badgeClass: "s1",
    title: "Cocoa MVC Mediation Flow",
    desc: "The Controller acts as the mediator. The Model and View never communicate directly in Cocoa MVC.",
    code: `// Model <-> Controller <-> View\n// Model and View never touch directly\ncontroller.updateView(with: model)`,
    svg: `
      <rect x="110" y="25" width="100" height="45" rx="6" fill="var(--step1-soft)" stroke="var(--step1-color)" stroke-width="2" />
      <text x="160" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="var(--step1-color)">Controller</text>

      <line x1="130" y1="70" x2="80" y2="120" stroke="var(--step1-color)" stroke-width="2" />
      <line x1="190" y1="70" x2="240" y2="120" stroke="var(--step1-color)" stroke-width="2" />

      <rect x="30" y="120" width="100" height="45" rx="6" fill="var(--surface)" stroke="var(--line)" stroke-width="2" />
      <text x="80" y="147" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">Model</text>

      <rect x="190" y="120" width="100" height="45" rx="6" fill="var(--surface)" stroke="var(--line)" stroke-width="2" />
      <text x="240" y="147" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">View</text>

      <line x1="130" y1="142" x2="190" y2="142" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3,3" />
      <text x="160" y="138" text-anchor="middle" font-size="12" fill="red">&#10005;</text>
      <text x="160" y="185" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">Isolated Model and View</text>
    `
  },
  {
    step: 2,
    badge: "Step 2",
    badgeClass: "s2",
    title: "Massive View Controller Trap",
    desc: "Overloading UIViewController with networking, data sources, routing, and formatting creates an unmaintainable 1,000+ line file.",
    code: `class ProfileViewController: UIViewController {\n  // Lifecycle + Layout + URLSession\n  // + TableViewDataSource + Navigation ...\n}`,
    svg: `
      <rect x="50" y="25" width="220" height="135" rx="8" fill="var(--step2-soft)" stroke="var(--step2-color)" stroke-width="2" />
      <text x="160" y="48" text-anchor="middle" font-size="12" font-weight="700" fill="var(--step2-color)">Massive UIViewController</text>

      <rect x="65" y="58" width="85" height="20" rx="3" fill="var(--surface)" />
      <text x="107" y="72" text-anchor="middle" font-size="8" fill="var(--ink)">Lifecycle & Views</text>

      <rect x="170" y="58" width="85" height="20" rx="3" fill="var(--surface)" />
      <text x="212" y="72" text-anchor="middle" font-size="8" fill="var(--ink)">URLSession Calls</text>

      <rect x="65" y="85" width="85" height="20" rx="3" fill="var(--surface)" />
      <text x="107" y="99" text-anchor="middle" font-size="8" fill="var(--ink)">TableViewDataSource</text>

      <rect x="170" y="85" width="85" height="20" rx="3" fill="var(--surface)" />
      <text x="212" y="99" text-anchor="middle" font-size="8" fill="var(--ink)">Navigation Segues</text>

      <rect x="65" y="112" width="85" height="20" rx="3" fill="var(--surface)" />
      <text x="107" y="126" text-anchor="middle" font-size="8" fill="var(--ink)">Data Validation</text>

      <rect x="170" y="112" width="85" height="20" rx="3" fill="var(--surface)" />
      <text x="212" y="126" text-anchor="middle" font-size="8" fill="var(--ink)">String Formatting</text>

      <text x="160" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="var(--step2-color)">Violates Single Responsibility Principle</text>
    `
  },
  {
    step: 3,
    badge: "Step 3",
    badgeClass: "s3",
    title: "Extracting Responsibilities",
    desc: "Carve out networking services, dedicated diffable data sources, and formatters into separate, focused Swift types.",
    code: `let service = NetworkService()\nlet dataSource = ProfileDataSource()\nlet formatter = DateFormatterHelper()`,
    svg: `
      <rect x="110" y="30" width="100" height="35" rx="6" fill="var(--step3-soft)" stroke="var(--step3-color)" stroke-width="2" />
      <text x="160" y="52" text-anchor="middle" font-size="10" font-weight="700" fill="var(--step3-color)">Lean Controller</text>

      <line x1="120" y1="65" x2="60" y2="100" stroke="var(--step3-color)" stroke-width="1.5" />
      <line x1="160" y1="65" x2="160" y2="100" stroke="var(--step3-color)" stroke-width="1.5" />
      <line x1="200" y1="65" x2="260" y2="100" stroke="var(--step3-color)" stroke-width="1.5" />

      <rect x="15" y="100" width="90" height="40" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5" />
      <text x="60" y="118" text-anchor="middle" font-size="9" font-weight="600" fill="var(--ink)">NetworkService</text>
      <text x="60" y="131" text-anchor="middle" font-size="8" fill="var(--muted)">API calls</text>

      <rect x="115" y="100" width="90" height="40" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5" />
      <text x="160" y="118" text-anchor="middle" font-size="9" font-weight="600" fill="var(--ink)">DiffableSource</text>
      <text x="160" y="131" text-anchor="middle" font-size="8" fill="var(--muted)">Cells & data</text>

      <rect x="215" y="100" width="90" height="40" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5" />
      <text x="260" y="118" text-anchor="middle" font-size="9" font-weight="600" fill="var(--ink)">Formatters</text>
      <text x="260" y="131" text-anchor="middle" font-size="8" fill="var(--muted)">Text & dates</text>

      <text x="160" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">Decompose by business function</text>
    `
  },
  {
    step: 4,
    badge: "Step 4",
    badgeClass: "s4",
    title: "Clean Modular Architecture",
    desc: "The view controller stays small and coordinates helpers. Pure Swift components can be tested in isolation in milliseconds.",
    code: `// Test services without loading UIKit\nlet testService = MockUserService()\nlet user = testService.fetchUser()\nXCTAssertEqual(user.name, "Taylor")`,
    svg: `
      <rect x="25" y="35" width="270" height="115" rx="8" fill="var(--step4-soft)" stroke="var(--step4-color)" stroke-width="2" />
      <text x="160" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="var(--step4-color)">Testable Separation of Concerns</text>

      <rect x="40" y="70" width="115" height="32" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="1" />
      <text x="97" y="90" text-anchor="middle" font-size="9" font-weight="600" fill="var(--ink)">Headless Unit Tests</text>

      <rect x="165" y="70" width="115" height="32" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="1" />
      <text x="222" y="90" text-anchor="middle" font-size="9" font-weight="600" fill="var(--ink)">Container Child VCs</text>

      <text x="160" y="125" text-anchor="middle" font-size="10" fill="var(--ink)">Fast compilation & clear domain boundaries</text>
      <text x="160" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="var(--step4-color)">Maintainable, modular iOS architecture</text>
    `
  }
];

let curIdx = 0;
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const dots = document.querySelectorAll('.step-dot');
const badge = document.getElementById('badge');
const title = document.getElementById('title');
const desc = document.getElementById('desc');
const codeSnippet = document.getElementById('codeSnippet');
const visualScene = document.getElementById('visualScene');

function render(idx) {
  curIdx = idx;
  const s = steps[idx];
  badge.textContent = s.badge;
  badge.className = 'kind ' + s.badgeClass;
  title.textContent = s.title;
  desc.textContent = s.desc;
  codeSnippet.textContent = s.code;
  visualScene.innerHTML = s.svg;

  dots.forEach((d, i) => {
    const act = i === idx;
    d.classList.toggle('active', act);
    d.setAttribute('aria-selected', act ? 'true' : 'false');
  });

  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === steps.length - 1;
}

prevBtn.addEventListener('click', () => { if (curIdx > 0) render(curIdx - 1); });
nextBtn.addEventListener('click', () => { if (curIdx < steps.length - 1) render(curIdx + 1); });
dots.forEach((d, i) => d.addEventListener('click', () => render(i)));

render(0);
</script>
</body>
</html>
