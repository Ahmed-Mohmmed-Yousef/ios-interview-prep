<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HTTP and REST Basics: Request-Response Lifecycle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #f5f7fb; --surface: #ffffff; --ink: #172033; --muted: #5a6478; --line: #c9d1df;
  --step1-color: #0284c7; --step1-soft: #e0f2fe;
  --step2-color: #7c3aed; --step2-soft: #f5f3ff;
  --step3-color: #16a34a; --step3-soft: #dcfce7;
  --step4-color: #dc2626; --step4-soft: #fee2e2;
  --code-bg: #eef1f7;
  --font-body: "Lexend", system-ui, -apple-system, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141c; --surface: #171e29; --ink: #e6ebf2; --muted: #9aa5b8;
  --line: #3a4658;
  --step1-color: #38bdf8; --step1-soft: #082f49;
  --step2-color: #a78bfa; --step2-soft: #2e1065;
  --step3-color: #4ade80; --step3-soft: #052e16;
  --step4-color: #f87171; --step4-soft: #450a0a;
  --code-bg: #111821; color-scheme: dark;
} }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body);
  margin: 0; padding: 20px;
}
.diagram-host { max-width: 840px; margin: 0 auto; display: grid; gap: 16px; }

.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 640px) { .panels { grid-template-columns: 1fr; } }

.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px; display: grid; gap: 10px; min-width: 0;
}
.panel h3 { margin: 0; font-size: 16px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.kind { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.kind.s1 { background: var(--step1-soft); color: var(--step1-color); }
.kind.s2 { background: var(--step2-soft); color: var(--step2-color); }
.kind.s3 { background: var(--step3-soft); color: var(--step3-color); }
.kind.s4 { background: var(--step4-soft); color: var(--step4-color); }

.code {
  font: 13px/1.5 var(--font-code); background: var(--code-bg); border-radius: 8px;
  padding: 8px 12px; min-height: 4.4em; white-space: pre; overflow-x: auto;
}
.caption { margin: 0; font-size: 14px; font-weight: 500; min-height: 2.8em; }

svg { width: 100%; height: auto; display: block; }
.device-frame { fill: var(--surface); stroke: var(--line); stroke-width: 3; rx: 18px; }
.base-screen { fill: var(--code-bg); }

.stepper {
  display: flex; gap: 12px; align-items: center; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 16px;
}
.step-indicators { display: flex; gap: 8px; }
.step-dot {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  font-size: 12px; font-weight: 600; background: var(--code-bg); color: var(--muted);
  border: 1px solid var(--line); cursor: pointer; transition: all 0.2s;
}
.step-dot.active {
  background: var(--step1-color); color: #ffffff; border-color: var(--step1-color);
}
.btn-group { display: flex; gap: 8px; }
button {
  background: var(--surface); border: 1px solid var(--line); color: var(--ink);
  font: 14px/1 var(--font-body); font-weight: 600; padding: 8px 14px; border-radius: 8px;
  cursor: pointer; transition: background 0.2s, border-color 0.2s;
}
button:hover:not(:disabled) { background: var(--code-bg); border-color: var(--step1-color); }
button:disabled { opacity: 0.4; cursor: not-allowed; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div class="diagram-host" role="region" aria-label="HTTP and REST Lifecycle Diagram">
  <div class="stepper">
    <div class="step-indicators" role="tablist" aria-label="Steps">
      <div class="step-dot active" role="tab" aria-selected="true" data-step="1">1</div>
      <div class="step-dot" role="tab" aria-selected="false" data-step="2">2</div>
      <div class="step-dot" role="tab" aria-selected="false" data-step="3">3</div>
      <div class="step-dot" role="tab" aria-selected="false" data-step="4">4</div>
    </div>
    <div class="btn-group">
      <button id="prevBtn" disabled aria-label="Previous step">Back</button>
      <button id="nextBtn" aria-label="Next step">Next</button>
    </div>
  </div>

  <div class="panels">
    <div class="panel">
      <h3><span class="kind s1" id="badge">Step 1</span> <span id="title">Build HTTP Request</span></h3>
      <p class="caption" id="desc">The iOS app prepares an HTTP request with a Method, resource URL, headers for content type and auth token, and an optional body.</p>
      <div class="code" id="codeSnippet">GET /api/v1/users/42 HTTP/1.1
Host: api.example.com
Accept: application/json
Authorization: Bearer token123</div>
    </div>

    <div class="panel" style="display:flex; align-items:center; justify-content:center;">
      <svg viewBox="0 0 320 220" role="img" aria-label="Visual illustration of HTTP request-response">
        <rect x="10" y="10" width="300" height="200" class="device-frame" />
        <rect x="25" y="25" width="270" height="170" rx="10" class="base-screen" />

        <!-- Dynamic elements -->
        <g id="visualScene">
          <!-- Step 1 visual -->
          <rect x="40" y="60" width="90" height="100" rx="8" fill="var(--surface)" stroke="var(--step1-color)" stroke-width="2" />
          <text x="85" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="var(--step1-color)">iOS App</text>
          <text x="85" y="110" text-anchor="middle" font-size="10" fill="var(--muted)">Client</text>

          <path d="M 140 100 L 190 100" stroke="var(--step1-color)" stroke-width="2" stroke-dasharray="4" />
          <polygon points="190,95 200,100 190,105" fill="var(--step1-color)" />

          <rect x="200" y="60" width="80" height="100" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5" />
          <text x="240" y="85" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">Server</text>
          <text x="240" y="110" text-anchor="middle" font-size="10" fill="var(--muted)">API</text>
          <text x="160" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="var(--step1-color)">GET /users/42</text>
        </g>
      </svg>
    </div>
  </div>
</div>

<script>
const steps = [
  {
    step: 1,
    badge: "Step 1",
    badgeClass: "s1",
    title: "Build HTTP Request",
    desc: "The iOS app prepares an HTTP request with a Method, resource URL, headers for content type and auth token, and an optional body.",
    code: `GET /api/v1/users/42 HTTP/1.1\nHost: api.example.com\nAccept: application/json\nAuthorization: Bearer token123`,
    svg: `
      <rect x="40" y="60" width="90" height="100" rx="8" fill="var(--surface)" stroke="var(--step1-color)" stroke-width="2" />
      <text x="85" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="var(--step1-color)">iOS App</text>
      <text x="85" y="110" text-anchor="middle" font-size="10" fill="var(--muted)">Client</text>
      <path d="M 140 100 L 190 100" stroke="var(--step1-color)" stroke-width="2" stroke-dasharray="4" />
      <polygon points="190,95 200,100 190,105" fill="var(--step1-color)" />
      <rect x="200" y="60" width="80" height="100" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5" />
      <text x="240" y="85" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">Server</text>
      <text x="240" y="110" text-anchor="middle" font-size="10" fill="var(--muted)">API</text>
      <text x="160" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="var(--step1-color)">GET /users/42</text>
    `
  },
  {
    step: 2,
    badge: "Step 2",
    badgeClass: "s2",
    title: "Stateless Processing",
    desc: "REST requests are stateless. The server does not store previous session state; the request contains complete credentials and parameters.",
    code: `// Statelessness principle:\n// Every request carries its own credentials.\n// No server session state required.`,
    svg: `
      <rect x="60" y="55" width="200" height="100" rx="10" fill="var(--surface)" stroke="var(--step2-color)" stroke-width="2" />
      <text x="160" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="var(--step2-color)">Stateless Execution</text>
      <text x="160" y="105" text-anchor="middle" font-size="11" fill="var(--ink)">No session cookies needed</text>
      <text x="160" y="125" text-anchor="middle" font-size="10" fill="var(--muted)">Authentication via Bearer token</text>
      <text x="160" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">Server validates token & queries DB</text>
    `
  },
  {
    step: 3,
    badge: "Step 3",
    badgeClass: "s3",
    title: "Success Response (200 OK)",
    desc: "The server returns status code 200 OK with response headers and the JSON representation of the requested user in the body.",
    code: `HTTP/1.1 200 OK\nContent-Type: application/json\n\n{"id": 42, "name": "Jane", "email": "jane@example.com"}`,
    svg: `
      <rect x="50" y="50" width="220" height="110" rx="10" fill="var(--surface)" stroke="var(--step3-color)" stroke-width="2" />
      <circle cx="80" cy="80" r="14" fill="var(--step3-soft)" stroke="var(--step3-color)" stroke-width="2" />
      <text x="80" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="var(--step3-color)">200</text>
      <text x="110" y="84" font-size="13" font-weight="700" fill="var(--step3-color)">200 OK (Success)</text>
      <line x1="65" y1="105" x2="255" y2="105" stroke="var(--line)" stroke-width="1" />
      <text x="160" y="125" text-anchor="middle" font-size="10" font-family="var(--font-code)" fill="var(--ink)">{"id": 42, "name": "Jane"}</text>
      <text x="160" y="145" text-anchor="middle" font-size="10" fill="var(--muted)">Parsed into Swift Codable model</text>
    `
  },
  {
    step: 4,
    badge: "Step 4",
    badgeClass: "s4",
    title: "Error Status Families (4xx & 5xx)",
    desc: "When errors occur, standard status codes guide client logic: 401 triggers login re-auth, 403 blocks access, and 500 triggers retry.",
    code: `switch response.statusCode {\ncase 401: refreshTokenAndRetry()\ncase 403: showPermissionDeniedAlert()\ncase 500...599: scheduleBackoffRetry()\n}`,
    svg: `
      <rect x="40" y="45" width="115" height="55" rx="6" fill="var(--step4-soft)" stroke="var(--step4-color)" stroke-width="1.5" />
      <text x="97" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="var(--step4-color)">401 Unauthorized</text>
      <text x="97" y="85" text-anchor="middle" font-size="9" fill="var(--ink)">Token expired</text>

      <rect x="165" y="45" width="115" height="55" rx="6" fill="var(--surface)" stroke="var(--step4-color)" stroke-width="1.5" />
      <text x="222" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="var(--step4-color)">403 Forbidden</text>
      <text x="222" y="85" text-anchor="middle" font-size="9" fill="var(--muted)">Lacks permission</text>

      <rect x="40" y="110" width="115" height="55" rx="6" fill="var(--surface)" stroke="var(--step4-color)" stroke-width="1.5" />
      <text x="97" y="133" text-anchor="middle" font-size="11" font-weight="700" fill="var(--step4-color)">404 Not Found</text>
      <text x="97" y="150" text-anchor="middle" font-size="9" fill="var(--muted)">Resource missing</text>

      <rect x="165" y="110" width="115" height="55" rx="6" fill="var(--step4-soft)" stroke="var(--step4-color)" stroke-width="1.5" />
      <text x="222" y="133" text-anchor="middle" font-size="11" font-weight="700" fill="var(--step4-color)">500 Server Error</text>
      <text x="222" y="150" text-anchor="middle" font-size="9" fill="var(--ink)">Backend crash</text>
    `
  }
];

let curIdx = 0;
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const dots = document.querySelectorAll('.step-dot');
const badge = document.getElementById('badge');
const title = document.getElementById('title');
const desc = document.getElementById('desc');
const codeSnippet = document.getElementById('codeSnippet');
const visualScene = document.getElementById('visualScene');

function render(idx) {
  curIdx = idx;
  const s = steps[idx];
  badge.textContent = s.badge;
  badge.className = 'kind ' + s.badgeClass;
  title.textContent = s.title;
  desc.textContent = s.desc;
  codeSnippet.textContent = s.code;
  visualScene.innerHTML = s.svg;

  dots.forEach((d, i) => {
    const act = i === idx;
    d.classList.toggle('active', act);
    d.setAttribute('aria-selected', act ? 'true' : 'false');
  });

  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === steps.length - 1;
}

prevBtn.addEventListener('click', () => { if (curIdx > 0) render(curIdx - 1); });
nextBtn.addEventListener('click', () => { if (curIdx < steps.length - 1) render(curIdx + 1); });
dots.forEach((d, i) => d.addEventListener('click', () => render(i)));

render(0);
</script>
</body>
</html>
