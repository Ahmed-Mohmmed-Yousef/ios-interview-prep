<title>App Launch Time Diagram</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #f5f7fb; --surface: #ffffff; --ink: #172033; --muted: #5a6478; --line: #c9d1df;
  --value: #0f7f63; --value-soft: #dcf2ea;
  --shared: #6447d1; --shared-soft: #ebe6fb;
  --changed: #a76a12; --changed-soft: #fcefd6;
  --code-bg: #eef1f7;
  --font-body: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141c; --surface: #171e29; --ink: #e6ebf2; --muted: #9aa5b8;
  --line: #3a4658; --value: #45cfa3; --value-soft: #13362c; --shared: #a690ff; --shared-soft: #251f42;
  --changed: #f2c14e; --changed-soft: #3a2e12; --code-bg: #111821; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f141c; --surface: #171e29; --ink: #e6ebf2; --muted: #9aa5b8;
  --line: #3a4658; --value: #45cfa3; --value-soft: #13362c; --shared: #a690ff; --shared-soft: #251f42;
  --changed: #f2c14e; --changed-soft: #3a2e12; --code-bg: #111821; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 900px; margin: 0 auto; display: grid; gap: 20px; }
.eyebrow { font-size: 13px; font-weight: 500; letter-spacing: 0.04em; color: var(--muted); margin: 0; }
h1 { font-size: clamp(24px, 4.4vw, 34px); line-height: 1.15; margin: 4px 0 6px; text-wrap: balance; font-weight: 700; }
.lede { margin: 0; color: var(--muted); max-width: 60ch; }

.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 680px) { .panels { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.panel h2 { margin: 0; font-size: 17px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.kind { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; }
.slow .kind { background: var(--changed-soft); color: var(--changed); }
.fast .kind { background: var(--value-soft); color: var(--value); }
svg { width: 100%; height: auto; display: block; }
.code {
  font: 13px/1.45 var(--font-code); background: var(--code-bg); border-radius: 10px; padding: 8px 12px;
  min-height: 3.2em; overflow-x: auto; white-space: pre;
}
.caption { margin: 0; font-weight: 500; min-height: 2.6em; }

.stage-box { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; transition: opacity .35s ease, fill .35s ease, stroke .35s ease; }
.stage-label { font-family: var(--font-body); font-size: 12px; font-weight: 600; fill: var(--ink); }
.stage-sub { font-family: var(--font-code); font-size: 11px; fill: var(--muted); }
.slow .stage-box.active { fill: var(--changed-soft); stroke: var(--changed); stroke-width: 2; }
.fast .stage-box.active { fill: var(--value-soft); stroke: var(--value); stroke-width: 2; }
.dim { opacity: 0.28; }
.frame-badge { fill: var(--shared-soft); stroke: var(--shared); stroke-width: 1.5; }
.frame-text { font-family: var(--font-body); font-size: 11px; font-weight: 700; fill: var(--shared); }
.axis { stroke: var(--line); stroke-width: 1.5; }
.axis-label { font-family: var(--font-code); font-size: 11px; fill: var(--muted); }

.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
.bar button {
  font: 600 15px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 9px 18px; cursor: pointer; min-height: 44px;
}
.bar button.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.bar button:disabled { opacity: .4; cursor: default; }
.bar button:focus-visible, .dots button:focus-visible, summary:focus-visible { outline: 3px solid var(--shared); outline-offset: 2px; }
.dots { display: flex; gap: 8px; }
.dots button { width: 14px; height: 14px; min-height: 0; padding: 0; border-radius: 50%; border: 2px solid var(--ink); background: transparent; }
.dots button[aria-current="step"] { background: var(--ink); }
.count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 6.5em; text-align: center; }

details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
summary { cursor: pointer; font-weight: 600; }
details ol { margin: 10px 0 0; padding-left: 22px; display: grid; gap: 10px; }
details li p { margin: 0; }
details code { font-family: var(--font-code); font-size: 13px; background: var(--code-bg); padding: 1px 6px; border-radius: 6px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Mid · Performance · Diagram</p>
    <h1>Cold Launch: Slow vs Fast</h1>
    <p class="lede">Step through a cold app launch from tapping the icon to drawing the first frame.</p>
  </header>

  <figure class="panels" id="figure" role="img" aria-label="Two panels comparing slow launch and fast launch. Left: many dynamic libraries and eager SDK setup delay the first frame past 900 milliseconds. Right: merged libraries and deferred SDK setup show the first frame under 400 milliseconds." style="margin:0">
    <section class="panel slow" aria-hidden="true">
      <h2>Slow Launch <span class="kind">blocks first frame</span></h2>
      <svg viewBox="0 0 340 230">
        <line class="axis" x1="16" y1="200" x2="324" y2="200"/>
        <text class="axis-label" x="16" y="218">0 ms</text>
        <text class="axis-label" x="148" y="218">400 ms</text>
        <text class="axis-label" x="278" y="218">950 ms</text>
        <line class="axis" x1="165" y1="14" x2="165" y2="200" stroke-dasharray="4 4"/>

        <g id="sl-1" class="dim">
          <rect class="stage-box" id="sl-b1" x="16" y="22" width="120" height="44" rx="10"/>
          <text class="stage-label" x="26" y="41">1. dyld (14 dylibs)</text>
          <text class="stage-sub" x="26" y="57">+ static +load</text>
        </g>
        <g id="sl-2" class="dim">
          <rect class="stage-box" id="sl-b2" x="142" y="22" width="110" height="44" rx="10"/>
          <text class="stage-label" x="152" y="41">2. Eager SDKs</text>
          <text class="stage-sub" x="152" y="57">didFinishLaunching</text>
        </g>
        <g id="sl-3" class="dim">
          <rect class="stage-box" id="sl-b3" x="16" y="84" width="210" height="44" rx="10"/>
          <text class="stage-label" x="26" y="103">3. Sync disk read + layout</text>
          <text class="stage-sub" x="26" y="119">blocks main thread</text>
        </g>
        <g id="sl-4" class="dim">
          <rect class="frame-badge" x="234" y="84" width="90" height="44" rx="10"/>
          <text class="frame-text" x="279" y="104" text-anchor="middle">First Frame</text>
          <text class="stage-sub" x="279" y="119" text-anchor="middle">~950 ms</text>
        </g>
      </svg>
      <div class="code" id="sl-code"></div>
      <p class="caption" id="sl-cap"></p>
    </section>

    <section class="panel fast" aria-hidden="true">
      <h2>Fast Launch <span class="kind">under budget</span></h2>
      <svg viewBox="0 0 340 230">
        <line class="axis" x1="16" y1="200" x2="324" y2="200"/>
        <text class="axis-label" x="16" y="218">0 ms</text>
        <text class="axis-label" x="148" y="218">400 ms</text>
        <text class="axis-label" x="278" y="218">950 ms</text>
        <line class="axis" x1="165" y1="14" x2="165" y2="200" stroke-dasharray="4 4"/>

        <g id="fa-1" class="dim">
          <rect class="stage-box" id="fa-b1" x="16" y="22" width="76" height="44" rx="10"/>
          <text class="stage-label" x="24" y="41">1. dyld</text>
          <text class="stage-sub" x="24" y="57">merged</text>
        </g>
        <g id="fa-2" class="dim">
          <rect class="stage-box" id="fa-b2" x="98" y="22" width="72" height="44" rx="10"/>
          <text class="stage-label" x="106" y="41">2. UI</text>
          <text class="stage-sub" x="106" y="57">minimal</text>
        </g>
        <g id="fa-3" class="dim">
          <rect class="frame-badge" x="98" y="84" width="90" height="44" rx="10"/>
          <text class="frame-text" x="143" y="104" text-anchor="middle">First Frame</text>
          <text class="stage-sub" x="143" y="119" text-anchor="middle">~320 ms</text>
        </g>
        <g id="fa-4" class="dim">
          <rect class="stage-box" id="fa-b4" x="196" y="84" width="128" height="44" rx="10"/>
          <text class="stage-label" x="206" y="103">4. Deferred SDKs</text>
          <text class="stage-sub" x="206" y="119">after first frame</text>
        </g>
      </svg>
      <div class="code" id="fa-code"></div>
      <p class="caption" id="fa-cap"></p>
    </section>
  </figure>

  <p class="sr-only" id="live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></p>

  <nav class="bar" aria-label="Diagram steps">
    <button type="button" id="back">Back</button>
    <div class="dots" id="dots"></div>
    <span class="count" id="count"></span>
    <button type="button" id="next" class="primary">Next</button>
    <button type="button" id="replay">Replay</button>
  </nav>

  <details id="all">
    <summary>All steps as a list</summary>
    <ol id="list"></ol>
  </details>
</div>

<script>
const STEPS = [
  {
    s: { code: "// Pre-main: dyld loads 14 dylibs", cap: "dyld spends extra time linking many dynamic frameworks." },
    f: { code: "MERGED_BINARY_TYPE = Automatic", cap: "Mergeable libraries reduce dynamic frameworks into one binary." }
  },
  {
    s: { code: "AnalyticsSDK.startSync()", cap: "Heavy SDKs initialize inside didFinishLaunching." },
    f: { code: "window?.makeKeyAndVisible()", cap: "Only minimal window and scene setup runs before the screen draws." }
  },
  {
    s: { code: "let data = try Data(contentsOf: bigFile)", cap: "Synchronous disk work blocks the main thread before drawing." },
    f: { code: "startup.markFirstFrameVisible()", cap: "The first frame renders quickly, under the 400 ms target." }
  },
  {
    s: { code: "// First frame arrives at ~950 ms", cap: "The user waits almost a full second to see the UI." },
    f: { code: "Task { await AnalyticsSDK.start() }", cap: "Optional SDKs start after the user already sees the app." }
  }
];
const $ = (id) => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
let step = 0;

function render() {
  const n = step + 1;
  for (let i = 1; i <= 4; i++) {
    $("sl-" + i).classList.toggle("dim", n < i);
    $("fa-" + i).classList.toggle("dim", n < i);
  }
  ["sl-b1", "sl-b2", "sl-b3"].forEach((id, idx) => $(id).classList.toggle("active", n === idx + 1));
  $("fa-b1").classList.toggle("active", n === 1);
  $("fa-b2").classList.toggle("active", n === 2);
  $("fa-b4").classList.toggle("active", n === 4);

  const st = STEPS[step];
  $("sl-code").textContent = st.s.code;
  $("fa-code").textContent = st.f.code;
  $("sl-cap").textContent = st.s.cap;
  $("fa-cap").textContent = st.f.cap;
  $("count").textContent = "Step " + n + " of " + STEPS.length;
  $("live").textContent = "Step " + n + ". Slow: " + st.s.cap + " Fast: " + st.f.cap;
  $("back").disabled = step === 0;
  $("next").disabled = step === STEPS.length - 1;
  [...$("dots").children].forEach((d, i) => i === step ? d.setAttribute("aria-current", "step") : d.removeAttribute("aria-current"));
}

function go(i) { step = Math.max(0, Math.min(STEPS.length - 1, i)); render(); }

STEPS.forEach((st, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.setAttribute("aria-label", "Diagram step " + (i + 1) + " of " + STEPS.length);
  b.addEventListener("click", () => go(i));
  $("dots").append(b);
  const li = document.createElement("li");
  li.innerHTML = "<p><b>Slow:</b> <code></code> — <span></span></p><p><b>Fast:</b> <code></code> — <span></span></p>";
  const [c1, c2] = li.querySelectorAll("code"), [t1, t2] = li.querySelectorAll("span");
  c1.textContent = st.s.code; t1.textContent = st.s.cap;
  c2.textContent = st.f.code; t2.textContent = st.f.cap;
  $("list").append(li);
});
$("back").addEventListener("click", () => go(step - 1));
$("next").addEventListener("click", () => go(step + 1));
$("replay").addEventListener("click", () => {
  go(0);
  if (reduce.matches) return;
  let i = 0;
  const t = setInterval(() => { i++; go(i); if (i >= STEPS.length - 1) clearInterval(t); }, 1100);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") go(step + 1);
  if (e.key === "ArrowLeft") go(step - 1);
});

if (reduce.matches) { step = STEPS.length - 1; $("all").open = true; }
render();
</script>
