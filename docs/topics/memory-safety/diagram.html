<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memory Safety and Exclusive Access Diagram</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #f5f7fb; --surface: #ffffff; --ink: #172033; --muted: #5a6478; --line: #c9d1df;
  --value: #0f7f63; --value-soft: #dcf2ea;
  --shared: #6447d1; --shared-soft: #ebe6fb;
  --changed: #a76a12; --changed-soft: #fcefd6;
  --code-bg: #eef1f7;
  --font-body: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141c; --surface: #171e29; --ink: #e6ebf2; --muted: #9aa5b8;
  --line: #3a4658; --value: #45cfa3; --value-soft: #13362c; --shared: #a690ff; --shared-soft: #251f42;
  --changed: #f2c14e; --changed-soft: #3a2e12; --code-bg: #111821; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f141c; --surface: #171e29; --ink: #e6ebf2; --muted: #9aa5b8;
  --line: #3a4658; --value: #45cfa3; --value-soft: #13362c; --shared: #a690ff; --shared-soft: #251f42;
  --changed: #f2c14e; --changed-soft: #3a2e12; --code-bg: #111821; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 900px; margin: 0 auto; display: grid; gap: 20px; }
.eyebrow { font-size: 13px; font-weight: 500; letter-spacing: 0.04em; color: var(--muted); margin: 0; }
h1 { font-size: clamp(24px, 4.4vw, 34px); line-height: 1.15; margin: 4px 0 6px; text-wrap: balance; font-weight: 700; }
.lede { margin: 0; color: var(--muted); max-width: 60ch; }

.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 680px) { .panels { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.panel h2 { margin: 0; font-size: 17px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.panel h2 code { font-family: var(--font-code); font-size: 15px; }
.kind { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; }
.excl .kind { background: var(--changed-soft); color: var(--changed); }
.strict .kind { background: var(--value-soft); color: var(--value); }
svg { width: 100%; height: auto; display: block; }
.code {
  font: 13px/1.5 var(--font-code); background: var(--code-bg); border-radius: 10px; padding: 8px 12px;
  min-height: 3.4em; overflow-x: auto; white-space: pre;
}
.caption { margin: 0; font-weight: 500; min-height: 2.8em; }

.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.6; }
.bar-ok { fill: var(--value-soft); stroke: var(--value); stroke-width: 1.8; }
.bar-wr { fill: var(--changed-soft); stroke: var(--changed); stroke-width: 2; }
.bar-aud { fill: var(--shared-soft); stroke: var(--shared); stroke-width: 1.8; }
.lbl { font-family: var(--font-body); font-size: 12px; font-weight: 600; fill: var(--ink); }
.sub { font-family: var(--font-code); font-size: 11px; fill: var(--muted); }
.warn { font-family: var(--font-body); font-size: 11px; font-weight: 600; fill: var(--changed); }
.oktxt { font-family: var(--font-body); font-size: 11px; font-weight: 600; fill: var(--value); }
.hidden { opacity: 0; }
.on { opacity: 1; }
@media (prefers-reduced-motion: no-preference) {
  .hidden, rect { transition: opacity .35s ease, fill .3s ease, stroke .3s ease; }
}

.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
.bar button {
  font: 600 15px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 9px 18px; cursor: pointer; min-height: 44px;
}
.bar button.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.bar button:disabled { opacity: .4; cursor: default; }
.bar button:focus-visible, .dots button:focus-visible, summary:focus-visible { outline: 3px solid var(--shared); outline-offset: 2px; }
.dots { display: flex; gap: 8px; }
.dots button { width: 14px; height: 14px; min-height: 0; padding: 0; border-radius: 50%; border: 2px solid var(--ink); background: transparent; }
.dots button[aria-current="step"] { background: var(--ink); }
.count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 6.5em; text-align: center; }

details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
summary { cursor: pointer; font-weight: 600; }
details ol { margin: 10px 0 0; padding-left: 22px; display: grid; gap: 10px; }
details li p { margin: 0; }
details code { font-family: var(--font-code); font-size: 14px; background: var(--code-bg); padding: 1px 6px; border-radius: 6px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Senior · Swift Language · Memory Safety</p>
    <h1>Exclusive access and Strict Memory Safety</h1>
    <p class="lede">Watch how long-term <code>inout</code> writes conflict with overlapping reads, and how <code>unsafe</code> marks pointer boundaries.</p>
  </header>

  <figure class="panels" id="figure" role="img" aria-label="Two panels. Left shows exclusive access: multiple instantaneous reads are safe, while a long-term inout write locks a variable and conflicts with an overlapping read or write. Right shows Strict Memory Safety flagging unmarked unsafe pointer use until wrapped with unsafe." style="margin:0">
    <section class="panel excl" aria-hidden="true">
      <h2><code>inout</code> <span class="kind">exclusivity</span></h2>
      <svg viewBox="0 0 340 220">
        <rect class="box" x="14" y="14" width="312" height="48" rx="10"/>
        <text class="lbl" x="26" y="34">Variable: step = 1</text>
        <text class="sub" id="e-lock" x="26" y="51">Access: unlocked</text>

        <rect class="bar-ok" id="e-read1" x="14" y="76" width="146" height="44" rx="10"/>
        <text class="lbl" x="26" y="96">Instantaneous read</text>
        <text class="oktxt" x="26" y="112">Safe (no overlap)</text>

        <rect class="bar-wr hidden" id="e-write" x="14" y="132" width="312" height="72" rx="10"/>
        <text class="lbl hidden" id="e-wt1" x="26" y="154">Long-term write: increment(&amp;step)</text>
        <text class="warn hidden" id="e-wt2" x="26" y="174">Write lock open across entire call</text>
        <text class="sub hidden" id="e-wt3" x="26" y="193">2nd access inside call -&gt; Conflict!</text>
      </svg>
      <div class="code" id="e-code"></div>
      <p class="caption" id="e-cap"></p>
    </section>

    <section class="panel strict" aria-hidden="true">
      <h2><code>-strict-memory-safety</code> <span class="kind">Swift 6.2+</span></h2>
      <svg viewBox="0 0 340 220">
        <rect class="box" x="14" y="14" width="312" height="58" rx="10"/>
        <text class="lbl" x="26" y="36">Safe Swift boundary</text>
        <text class="sub" x="26" y="56">withUnsafePointer(to: &amp;value) { ptr in</text>

        <rect class="bar-wr hidden" id="s-unmarked" x="14" y="84" width="312" height="56" rx="10"/>
        <text class="lbl hidden" id="s-u1" x="26" y="106">Unmarked: ptr.pointee</text>
        <text class="warn hidden" id="s-u2" x="26" y="126">Warning: needs 'unsafe' keyword</text>

        <rect class="bar-ok hidden" id="s-marked" x="14" y="152" width="312" height="56" rx="10"/>
        <text class="lbl hidden" id="s-m1" x="26" y="174">Marked: unsafe ptr.pointee</text>
        <text class="oktxt hidden" id="s-m2" x="26" y="194">Visible for code audit (or use Span)</text>
      </svg>
      <div class="code" id="s-code"></div>
      <p class="caption" id="s-cap"></p>
    </section>
  </figure>

  <p class="sr-only" id="live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></p>

  <nav class="bar" aria-label="Diagram steps">
    <button type="button" id="back">Back</button>
    <div class="dots" id="dots"></div>
    <span class="count" id="count"></span>
    <button type="button" id="next" class="primary">Next</button>
    <button type="button" id="replay">Replay</button>
  </nav>

  <details id="all">
    <summary>All steps as a list</summary>
    <ol id="list"></ol>
  </details>
  <p class="note">Use the arrow keys to move between steps.</p>
</div>

<script>
const STEPS = [
  {
    e: { code: "let copy = step // instantaneous read", cap: "Step 1: Instantaneous reads finish at once and never conflict." },
    s: { code: "withUnsafePointer(to: &value) { ptr in", cap: "Step 1: Calling withUnsafePointer itself is safe and needs no marker." }
  },
  {
    e: { code: "increment(&step) // opens write lock", cap: "Step 2: Passing &step as inout holds a long-term write lock." },
    s: { code: "  return ptr.pointee // warning!", cap: "Step 2: Using UnsafePointer without 'unsafe' triggers a StrictMemorySafety warning." }
  },
  {
    e: { code: "number += step // overlaps -> conflict!", cap: "Step 3: Reading step during increment(&step) crashes at runtime." },
    s: { code: "  return unsafe ptr.pointee // marked", cap: "Step 3: Prefixing with 'unsafe' marks the unsafe line for review." }
  },
  {
    e: { code: "let delta = step; increment(&step) // ok", cap: "Step 4: Copying step to delta first ends the overlap safely." },
    s: { code: "// Better: pass value.span (no unsafe!)", cap: "Step 4: Prefer Span or InlineArray to remove unsafe code completely." }
  }
];

const $ = (id) => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
let step = 0;

function render() {
  const n = step + 1;
  $("e-lock").textContent = n === 1 ? "Access: instantaneous read" : n === 2 ? "Access: write lock open" : n === 3 ? "CONFLICT: write + read overlap!" : "Fixed: read finishes before write";
  for (const id of ["e-write", "e-wt1", "e-wt2"]) $(id).classList.toggle("on", n >= 2);
  $("e-wt3").classList.toggle("on", n >= 3);
  $("e-wt3").textContent = n === 4 ? "Fix: read delta before call -> Safe!" : "2nd access inside call -> Conflict!";
  $("e-write").classList.toggle("bar-ok", n === 4);
  $("e-write").classList.toggle("bar-wr", n !== 4);

  for (const id of ["s-unmarked", "s-u1", "s-u2"]) $(id).classList.toggle("on", n >= 2);
  for (const id of ["s-marked", "s-m1", "s-m2"]) $(id).classList.toggle("on", n >= 3);
  $("s-m2").textContent = n === 4 ? "Best fix: replace pointers with Span" : "Visible for code audit";

  const st = STEPS[step];
  $("e-code").textContent = st.e.code;
  $("s-code").textContent = st.s.code;
  $("e-cap").textContent = st.e.cap;
  $("s-cap").textContent = st.s.cap;
  $("count").textContent = "Step " + n + " of " + STEPS.length;
  $("live").textContent = "Step " + n + ". Exclusivity: " + st.e.cap + " Strict Safety: " + st.s.cap;
  $("back").disabled = step === 0;
  $("next").disabled = step === STEPS.length - 1;
  [...$("dots").children].forEach((d, i) => i === step ? d.setAttribute("aria-current", "step") : d.removeAttribute("aria-current"));
}

function go(i) { step = Math.max(0, Math.min(STEPS.length - 1, i)); render(); }

STEPS.forEach((st, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.setAttribute("aria-label", "Diagram step " + (i + 1) + " of " + STEPS.length);
  b.addEventListener("click", () => go(i));
  $("dots").append(b);
  const li = document.createElement("li");
  li.innerHTML = "<p><b>Exclusivity:</b> <code></code> — <span></span></p><p><b>Strict Safety:</b> <code></code> — <span></span></p>";
  const [c1, c2] = li.querySelectorAll("code");
  const [t1, t2] = li.querySelectorAll("span");
  c1.textContent = st.e.code; t1.textContent = st.e.cap;
  c2.textContent = st.s.code; t2.textContent = st.s.cap;
  $("list").append(li);
});

$("back").addEventListener("click", () => go(step - 1));
$("next").addEventListener("click", () => go(step + 1));
$("replay").addEventListener("click", () => {
  go(0);
  if (reduce.matches) return;
  let i = 0;
  const t = setInterval(() => { i++; go(i); if (i >= STEPS.length - 1) clearInterval(t); }, 1100);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") go(step + 1);
  if (e.key === "ArrowLeft") go(step - 1);
});

if (reduce.matches) { step = STEPS.length - 1; $("all").open = true; }
render();
</script>
</body>
</html>
