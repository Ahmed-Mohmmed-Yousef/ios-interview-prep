<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dynamic Programming: Tabulation &amp; State Transition</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #f5f7fb; --surface: #ffffff; --ink: #172033; --muted: #5a6478; --line: #c9d1df;
  --dp-color: #0284c7; --dp-soft: #e0f2fe;
  --done-color: #059669; --done-soft: #d1fae5;
  --alert-color: #d97706; --alert-soft: #fef3c7;
  --code-bg: #eef1f7;
  --font-body: "Lexend", system-ui, -apple-system, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141c; --surface: #171e29; --ink: #e6ebf2; --muted: #9aa5b8;
  --line: #3a4658;
  --dp-color: #38bdf8; --dp-soft: #082f49;
  --done-color: #34d399; --done-soft: #064e3b;
  --alert-color: #fbbf24; --alert-soft: #451a03;
  --code-bg: #111821; color-scheme: dark;
} }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body);
  margin: 0; padding: 20px;
}
.diagram-host { max-width: 840px; margin: 0 auto; display: grid; gap: 16px; }

.controls {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 16px;
}
.btn-group { display: flex; gap: 8px; }
button {
  background: var(--surface); color: var(--ink); border: 1px solid var(--line);
  padding: 6px 14px; border-radius: 8px; font-weight: 500; font-family: inherit;
  cursor: pointer; transition: all 0.2s ease;
}
button:hover:not(:disabled) { border-color: var(--dp-color); color: var(--dp-color); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.step-label { font-weight: 600; font-size: 14px; color: var(--muted); }

.panels { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 16px; }
@media (max-width: 640px) { .panels { grid-template-columns: 1fr; } }

.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px; display: grid; gap: 10px; min-width: 0;
}
.panel h3 { margin: 0; font-size: 16px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.kind { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.p-table .kind { background: var(--dp-soft); color: var(--dp-color); }
.p-state .kind { background: var(--done-soft); color: var(--done-color); }

.code {
  font: 13px/1.5 var(--font-code); background: var(--code-bg); border-radius: 8px;
  padding: 8px 12px; min-height: 3.2em; white-space: pre; overflow-x: auto;
}
.caption { margin: 0; font-size: 14px; font-weight: 500; min-height: 2.6em; }

svg { width: 100%; height: auto; display: block; }
.cell-rect { rx: 8; ry: 8; stroke: var(--line); stroke-width: 2; fill: var(--code-bg); transition: all 0.3s ease; }
.cell-rect.active-input { stroke: var(--dp-color); fill: var(--dp-soft); stroke-width: 2.5; }
.cell-rect.active-target { stroke: var(--done-color); fill: var(--done-soft); stroke-width: 3; }
.cell-text { font-family: var(--font-code); font-weight: 700; font-size: 15px; fill: var(--ink); text-anchor: middle; dominant-baseline: middle; }
.cell-idx { font-family: var(--font-code); font-size: 11px; fill: var(--muted); text-anchor: middle; }
.trans-arrow { stroke: var(--dp-color); stroke-width: 2.5; fill: none; marker-end: url(#arrow); }

.badge-row { display: flex; flex-wrap: wrap; gap: 8px; }
.status-badge {
  display: inline-block; font-family: var(--font-code); font-size: 12px;
  padding: 4px 8px; border-radius: 6px; background: var(--code-bg); border: 1px solid var(--line);
}

@media (prefers-reduced-motion: reduce) {
  .cell-rect { transition: none !important; }
}
</style>
</head>
<body>
<div class="diagram-host" role="region" aria-label="Animated Dynamic Programming Diagram">
  <div class="controls">
    <div class="step-label" id="stepCounter" aria-live="polite">Step 1 of 4</div>
    <div class="btn-group">
      <button id="btnBack" type="button" aria-label="Previous step">Back</button>
      <button id="btnNext" type="button" aria-label="Next step">Next</button>
      <button id="btnReplay" type="button" aria-label="Replay from start">Replay</button>
    </div>
  </div>

  <div class="panels">
    <!-- DP Table Visualization -->
    <div class="panel p-table">
      <h3><span>DP Table (Climbing Stairs)</span><span class="kind">Bottom-Up</span></h3>
      <p class="caption" id="tableCaption">Base cases: dp[1] = 1, dp[2] = 2. Subproblems are initialized.</p>
      <svg viewBox="0 0 340 160" aria-label="Dynamic Programming Array Table">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--dp-color)" />
          </marker>
        </defs>

        <!-- Cell 1 (Step 1) -->
        <rect id="c1" x="20" y="45" width="65" height="50" class="cell-rect active-target" />
        <text id="t1" x="52" y="70" class="cell-text">1</text>
        <text x="52" y="115" class="cell-idx">dp[1]</text>

        <!-- Cell 2 (Step 2) -->
        <rect id="c2" x="100" y="45" width="65" height="50" class="cell-rect active-target" />
        <text id="t2" x="132" y="70" class="cell-text">2</text>
        <text x="132" y="115" class="cell-idx">dp[2]</text>

        <!-- Cell 3 (Step 3) -->
        <rect id="c3" x="180" y="45" width="65" height="50" class="cell-rect" />
        <text id="t3" x="212" y="70" class="cell-text">?</text>
        <text x="212" y="115" class="cell-idx">dp[3]</text>

        <!-- Cell 4 (Step 4) -->
        <rect id="c4" x="260" y="45" width="65" height="50" class="cell-rect" />
        <text id="t4" x="292" y="70" class="cell-text">?</text>
        <text x="292" y="115" class="cell-idx">dp[4]</text>

        <!-- Transition Curves -->
        <path id="arrowA" d="M 52 45 Q 132 15 205 40" class="trans-arrow" style="display:none;" />
        <path id="arrowB" d="M 132 45 Q 172 20 210 42" class="trans-arrow" style="display:none;" />
      </svg>
    </div>

    <!-- State & Recurrence Panel -->
    <div class="panel p-state">
      <h3><span>Transition State</span><span class="kind">Recurrence</span></h3>
      <p class="caption" id="stateCaption">Base values defined: dp[1] = 1, dp[2] = 2.</p>
      <div class="code" id="stateCode">dp[1] = 1 (1 step)<br>dp[2] = 2 (1+1 or 2 steps)</div>
      <div class="badge-row">
        <span class="status-badge" id="opBadge">Status: Base Cases</span>
        <span class="status-badge" id="spaceBadge">Space: O(N) Table</span>
      </div>
    </div>
  </div>
</div>

<script>
const steps = [
  {
    counter: "Step 1 of 4",
    tableCap: "Base cases: dp[1] = 1, dp[2] = 2. Next subproblem to compute is dp[3].",
    stateCap: "Base values defined: dp[1] = 1 (one 1-step), dp[2] = 2 (two 1-steps or one 2-step).",
    code: "dp[1] = 1\ndp[2] = 2\nNext: dp[3] = dp[2] + dp[1]",
    op: "Status: Base Cases Ready",
    space: "Table: [1, 2, ?, ?]",
    c1Val: "1", c2Val: "2", c3Val: "?", c4Val: "?",
    c1Class: "cell-rect active-target", c2Class: "cell-rect active-target",
    c3Class: "cell-rect", c4Class: "cell-rect",
    showArrowA: false, showArrowB: false
  },
  {
    counter: "Step 2 of 4",
    tableCap: "Compute dp[3]: Combine solutions from step 2 (2 ways) and step 1 (1 way): 2 + 1 = 3.",
    stateCap: "Recurrence applied: dp[3] = dp[2] + dp[1] = 3 ways. Result is stored in table.",
    code: "dp[3] = dp[2] + dp[1]\ndp[3] = 2 + 1 = 3\nStored in table without recalculating!",
    op: "Operation: Compute dp[3]",
    space: "Table: [1, 2, 3, ?]",
    c1Val: "1", c2Val: "2", c3Val: "3", c4Val: "?",
    c1Class: "cell-rect active-input", c2Class: "cell-rect active-input",
    c3Class: "cell-rect active-target", c4Class: "cell-rect",
    showArrowA: true, showArrowB: true,
    arrowAD: "M 52 45 Q 132 15 205 40",
    arrowBD: "M 132 45 Q 172 20 210 42"
  },
  {
    counter: "Step 3 of 4",
    tableCap: "Compute dp[4]: dp[4] = dp[3] + dp[2] = 3 + 2 = 5 ways. Target reached!",
    stateCap: "Target answer found: 5 distinct ways to reach top stair. Solved in linear O(N) time.",
    code: "dp[4] = dp[3] + dp[2]\ndp[4] = 3 + 2 = 5\nFinal Answer: 5 ways",
    op: "Operation: Compute Target dp[4]",
    space: "Table: [1, 2, 3, 5]",
    c1Val: "1", c2Val: "2", c3Val: "3", c4Val: "5",
    c1Class: "cell-rect", c2Class: "cell-rect active-input",
    c3Class: "cell-rect active-input", c4Class: "cell-rect active-target",
    showArrowA: true, showArrowB: true,
    arrowAD: "M 132 45 Q 212 15 285 40",
    arrowBD: "M 212 45 Q 252 20 290 42"
  },
  {
    counter: "Step 4 of 4",
    tableCap: "Space Optimization: Only 2 previous values needed! Roll prev1 and prev2 for O(1) memory.",
    stateCap: "Replace the entire array with two Int variables. Saves memory with zero recursion overhead.",
    code: "var prev2 = 1, prev1 = 2\ncurrent = prev1 + prev2 // 5\nprev2 = prev1; prev1 = current\nMemory: O(1) constant space!",
    op: "Status: O(1) Space Optimized",
    space: "Variables: prev1, prev2",
    c1Val: "-", c2Val: "-", c3Val: "3", c4Val: "5",
    c1Class: "cell-rect", c2Class: "cell-rect",
    c3Class: "cell-rect active-input", c4Class: "cell-rect active-target",
    showArrowA: false, showArrowB: false
  }
];

let curr = 0;
const stepCounter = document.getElementById("stepCounter");
const btnBack = document.getElementById("btnBack");
const btnNext = document.getElementById("btnNext");
const btnReplay = document.getElementById("btnReplay");

const tableCap = document.getElementById("tableCaption");
const stateCap = document.getElementById("stateCaption");
const stateCode = document.getElementById("stateCode");
const opBadge = document.getElementById("opBadge");
const spaceBadge = document.getElementById("spaceBadge");

const c1 = document.getElementById("c1"), t1 = document.getElementById("t1");
const c2 = document.getElementById("c2"), t2 = document.getElementById("t2");
const c3 = document.getElementById("c3"), t3 = document.getElementById("t3");
const c4 = document.getElementById("c4"), t4 = document.getElementById("t4");
const arrowA = document.getElementById("arrowA");
const arrowB = document.getElementById("arrowB");

function render() {
  const s = steps[curr];
  stepCounter.textContent = s.counter;
  btnBack.disabled = curr === 0;
  btnNext.disabled = curr === steps.length - 1;

  tableCap.textContent = s.tableCap;
  stateCap.textContent = s.stateCap;
  stateCode.innerHTML = s.code.replace(/\n/g, "<br>");
  opBadge.textContent = s.op;
  spaceBadge.textContent = s.space;

  t1.textContent = s.c1Val;
  t2.textContent = s.c2Val;
  t3.textContent = s.c3Val;
  t4.textContent = s.c4Val;

  c1.className.baseVal = s.c1Class;
  c2.className.baseVal = s.c2Class;
  c3.className.baseVal = s.c3Class;
  c4.className.baseVal = s.c4Class;

  if (s.showArrowA) {
    arrowA.style.display = "block";
    arrowA.setAttribute("d", s.arrowAD);
  } else {
    arrowA.style.display = "none";
  }

  if (s.showArrowB) {
    arrowB.style.display = "block";
    arrowB.setAttribute("d", s.arrowBD);
  } else {
    arrowB.style.display = "none";
  }
}

btnBack.addEventListener("click", () => { if (curr > 0) { curr--; render(); } });
btnNext.addEventListener("click", () => { if (curr < steps.length - 1) { curr++; render(); } });
btnReplay.addEventListener("click", () => { curr = 0; render(); });

render();
</script>
</body>
</html>
