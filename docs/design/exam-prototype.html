/* Tailwind v4: map the variables to utilities (bg-primary, text-muted-foreground, rounded-lg, ...). */

/* Layout: a prototype screen switcher on top, then one screen at a time in a centered column. Exam screens have a sticky header and a sticky action bar. */
* { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--foreground); font: 400 1rem/1.625rem var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 720px; margin: 0 auto; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.inner > * { min-width: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
a { color: var(--primary); }
h1 { font-size: 1.875rem; line-height: 2.375rem; margin: 0; text-wrap: balance; }
h2 { font-size: 1.3125rem; line-height: 1.875rem; margin: 0; text-wrap: balance; }
p { margin: 0; max-width: var(--reading-width); }
.small { font-size: .875rem; line-height: 1.375rem; color: var(--muted-foreground); }
.eyebrow { font-size: .75rem; line-height: 1.25rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-foreground); }
.num { font-variant-numeric: tabular-nums; }
code { font-family: var(--font-code); font-size: .9em; background: var(--code); padding: 1px 5px; border-radius: 6px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); box-shadow: var(--shadow-card); }
.btn { font: 600 1rem var(--font-body); border-radius: 999px; padding: 0 20px; min-height: var(--touch-target); border: 1.5px solid transparent; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.btn-primary { background: var(--primary); color: var(--primary-foreground); }
.btn-secondary { background: var(--secondary); color: var(--secondary-foreground); }
.btn-ghost { background: transparent; color: var(--foreground); border-color: var(--border); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.badge { display: inline-flex; gap: 6px; align-items: center; font-size: .75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border-radius: 999px; padding: 3px 10px; border: 1.5px solid currentColor; }
.b-pass { color: var(--success); } .b-notyet { color: var(--warn); } .b-type { color: var(--muted-foreground); }

.switcher { background: var(--secondary); padding-block: 10px; }
.switcher .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 .8125rem var(--font-body); color: var(--foreground); background: var(--card); border: 1.5px solid var(--border); border-radius: 999px; padding: 5px 11px; min-height: 34px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--foreground); color: var(--background); border-color: var(--foreground); }

.ex-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--card); border-bottom: 1px solid var(--border); padding-block: 8px 10px; }
.ex-top .inner { gap: 8px; }
.ex-head { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.ex-title { font-size: 1rem; line-height: 1.5rem; margin: 0; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.leave { font: 600 .875rem var(--font-body); color: var(--foreground); background: transparent; border: 1.5px solid var(--border); border-radius: 999px; padding: 6px 12px; min-height: 36px; cursor: pointer; flex: none; }
.bar { height: 8px; background: var(--muted); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--primary); transition: width var(--duration-normal) var(--ease-calm); }
.ex-meta { display: flex; justify-content: space-between; gap: 8px; }
main { padding-block: 18px 130px; }
.q-text { font-size: 1.3125rem; line-height: 1.875rem; font-weight: 600; text-wrap: balance; }
pre.code { margin: 0; font: .875rem/1.5rem var(--font-code); background: var(--code); border-radius: calc(var(--radius) * .9); padding: 12px 14px; overflow-x: auto; }
pre.code.model { background: var(--card); border: 1px solid var(--border); }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 2em minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left; font: 400 1rem/1.5rem var(--font-body); color: var(--foreground);
  background: var(--card); border: 1.5px solid var(--border); border-radius: calc(var(--radius) * .9); padding: 10px 12px; min-height: var(--touch-target); cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--foreground); }
.opt:disabled { cursor: default; }
.opt .id { font-weight: 700; color: var(--muted-foreground); }
.opt .mark { font-size: .75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.opt.picked { border-color: var(--primary); background: var(--secondary); }
.opt.right { border-color: var(--success); background: var(--success-soft); } .opt.right .mark { color: var(--success); }
.opt.wrong { border-color: var(--warn); background: var(--warn-soft); } .opt.wrong .mark { color: var(--warn); }
textarea { width: 100%; min-height: 9em; font: 1rem/1.5rem var(--font-body); color: var(--foreground); background: var(--card); border: 1.5px solid var(--input); border-radius: calc(var(--radius) * .9); padding: 10px 12px; }
textarea.code-in { font-family: var(--font-code); font-size: .875rem; }
.fb { border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 8px; }
.fb.ok { background: var(--success-soft); } .fb.no { background: var(--warn-soft); } .fb.neutral { background: var(--card); border: 1px solid var(--border); }
.crit { border: 1px solid var(--border); border-radius: calc(var(--radius) * .8); padding: 8px 12px; margin: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; background: var(--card); }
.crit legend { display: flex; justify-content: space-between; gap: 10px; width: 100%; padding: 0; float: left; margin-bottom: 4px; }
.crit label { display: inline-flex; gap: 6px; align-items: center; min-height: 36px; cursor: pointer; }
.key { color: var(--primary); font-size: .6875rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.actionbar { position: fixed; inset: auto 0 0 0; z-index: 4; background: var(--card); border-top: 1px solid var(--border); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
.actionbar .inner { display: flex; gap: 10px; justify-content: flex-end; }
.actionbar .btn { flex: 1; max-width: 340px; }

.score { font-size: 3.5rem; line-height: 1; font-weight: 700; margin: 0; }
.score.pass { color: var(--success); } .score.notyet { color: var(--warn); }
.resulthead { display: grid; gap: 8px; justify-items: start; }
.celebrate { width: 64px; height: 64px; }
.celebrate .ring { fill: var(--success); }
.celebrate .tick { fill: none; stroke: var(--success-foreground); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw var(--duration-slow) var(--ease-calm) var(--duration-normal) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .celebrate .tick { animation: none; stroke-dashoffset: 0; } }
.review { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.review li { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--border); border-radius: 0 var(--radius) var(--radius) 0; padding: 12px 14px; display: grid; gap: 6px; }
.review li.r-wrong { border-left-color: var(--warn); } .review li.r-right { border-left-color: var(--success); } .review li.r-self { border-left-color: var(--primary); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 2px; }
.stat b { font-size: 1.3125rem; }
.ready { border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 6px; }
.ready.r1 { background: var(--success-soft); } .ready.r2 { background: var(--secondary); }
.breakdown { display: grid; gap: 8px; }
.brow { display: grid; grid-template-columns: minmax(0, 1fr) 3.5em; gap: 4px 10px; align-items: center; }
.brow .bar { grid-column: 1 / -1; height: 6px; }
.stage-h { font-weight: 700; margin-top: 8px; }
.banner { background: var(--secondary); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 8px; }
</style>

<script>
const D = {"topic":{"id":"structs-vs-classes","title":"Structs vs Classes","next":"properties","nextTitle":"Properties"},"questions":[{"id":"structs-vs-classes-q1","type":"mcq","difficulty":1,"prompt":"Which of these is a value type in Swift?","options":[{"id":"a","text":"Neither. Swift has only reference types.","explanation":"Swift has both kinds. Structs and enums are value types. Classes are reference types."},{"id":"b","text":"A class","explanation":"A class is a reference type. Assigning it copies only the reference, not the instance."},{"id":"c","text":"Both a struct and a class","explanation":"Only the struct is a value type. A class is shared through references."},{"id":"d","text":"A struct","explanation":"Right. A struct is a value type. Swift copies it when you assign it or pass it to a function."}],"answer":"d"},{"id":"structs-vs-classes-q2","type":"mcq","difficulty":1,"prompt":"You assign a class instance to a new variable. What happens?","options":[{"id":"a","text":"Swift makes a full copy of the instance.","explanation":"That is what happens with a struct. A class is not copied."},{"id":"b","text":"Both variables point to the same instance.","explanation":"Right. Swift copies the reference, so both names reach one shared instance."},{"id":"c","text":"Swift copies only the var properties.","explanation":"Swift does not copy any properties. It copies only the reference."},{"id":"d","text":"The first variable becomes nil.","explanation":"The first variable still points to the instance. Now the second one does too."}],"answer":"b"},{"id":"structs-vs-classes-q3","type":"mcq","difficulty":1,"prompt":"What is Apple's default advice when you create a new data type?","options":[{"id":"a","text":"Use a class by default.","explanation":"Apple recommends the opposite. Use a class only when you need what a class gives you."},{"id":"b","text":"Use a struct by default.","explanation":"Right. Apple says to use structures by default, and classes when you need them."},{"id":"c","text":"Use a class for any type that has methods.","explanation":"Structs can have methods too, so methods are not a reason to choose a class."},{"id":"d","text":"Use a struct only for numbers and text.","explanation":"Structs fit most custom data, not only numbers and text."}],"answer":"b"},{"id":"structs-vs-classes-q4","type":"mcq","difficulty":1,"prompt":"Which of these can a class do, but a struct cannot?","options":[{"id":"a","text":"Have methods","explanation":"Both structs and classes can have methods."},{"id":"b","text":"Store properties","explanation":"Both structs and classes can store properties."},{"id":"c","text":"Be passed to a function","explanation":"You can pass both to a function. A struct is copied. A class reference is shared."},{"id":"d","text":"Inherit from another class","explanation":"Right. Only classes support inheritance. Structs use protocols to share behavior."}],"answer":"d"},{"id":"structs-vs-classes-q5","type":"mcq","difficulty":1,"prompt":"What does the `===` operator check?","options":[{"id":"a","text":"If two values are equal, using the rules of their type","explanation":"That is `==`. The `===` operator checks identity, not equal values."},{"id":"b","text":"If two references point to the same class instance","explanation":"Right. `===` checks identity: one and the same instance."},{"id":"c","text":"If two structs have the same type and the same values","explanation":"`===` does not work on structs. It is only for class instances."},{"id":"d","text":"If a variable is a let constant that cannot change","explanation":"`===` does not check `let` or `var`. It compares two references."}],"answer":"b"},{"id":"structs-vs-classes-q6","type":"mcq","difficulty":2,"prompt":"A struct is stored in a `let` constant. Its properties are declared with `var`. Can you change those properties?","options":[{"id":"a","text":"Yes, because the properties are var.","explanation":"For a struct, `let` makes the whole value constant, including its `var` properties."},{"id":"b","text":"No. A struct in a let constant cannot change at all.","explanation":"Right. When a value type is a constant, all of its properties are constant too."},{"id":"c","text":"Yes, but only inside a mutating method.","explanation":"You cannot call a `mutating` method on a `let` struct either."},{"id":"d","text":"Only if the struct has no methods.","explanation":"Methods do not matter here. A `let` struct cannot change."}],"answer":"b"},{"id":"structs-vs-classes-q7","type":"mcq","difficulty":2,"prompt":"A class instance is stored in a `let` constant. Why can you still change its `var` properties?","options":[{"id":"a","text":"Because let fixes the reference, not the instance.","explanation":"Right. The constant always points to the same instance, but that instance can change."},{"id":"b","text":"Because classes ignore let.","explanation":"They do not ignore it. You still cannot point the constant to another instance."},{"id":"c","text":"Because Swift copies the property first.","explanation":"Nothing is copied. The change happens on the one shared instance."},{"id":"d","text":"Because Swift turns the let into a var.","explanation":"The constant stays a constant. Only the instance it points to changes."}],"answer":"a"},{"id":"structs-vs-classes-q8","type":"mcq","difficulty":1,"prompt":"A struct method changes one of the struct's properties. Which keyword does the method need?","options":[{"id":"a","text":"final","explanation":"`final` stops a class from being subclassed. It has nothing to do with this."},{"id":"b","text":"override","explanation":"`override` is for replacing a method from a superclass. Structs do not have superclasses."},{"id":"c","text":"mutating","explanation":"Right. A struct method that changes a property must be marked `mutating`."},{"id":"d","text":"inout","explanation":"`inout` is for function parameters, not for marking methods."}],"answer":"c"},{"id":"structs-vs-classes-q9","type":"mcq","difficulty":2,"prompt":"When is a class a better choice than a struct?","options":[{"id":"a","text":"When the type has more than three properties to store","explanation":"The number of properties does not decide it. Copy or share decides it."},{"id":"b","text":"When the data comes from a server through a web API","explanation":"Server data is usually a struct, because the server owns its identity through an ID."},{"id":"c","text":"When the type needs methods that work on its data","explanation":"Structs can have methods too."},{"id":"d","text":"When many parts of the app must share one instance","explanation":"Right. A class fits when you need one shared instance with its own identity."}],"answer":"d"},{"id":"structs-vs-classes-q10","type":"mcq","difficulty":2,"prompt":"Your app decodes a `User` from server data. The server owns the user's identity through an ID. Which type fits best?","options":[{"id":"a","text":"A struct","explanation":"Right. The identity belongs to the server, so local copies are safe and simple."},{"id":"b","text":"A class, because the data comes from far away","explanation":"Where data comes from does not matter. The server already controls its identity."},{"id":"c","text":"A class, because decoding needs a class","explanation":"Structs can be decoded too. Decoding does not need a class."},{"id":"d","text":"A class, because users are important","explanation":"How important data is does not decide the type. Copy or share does."}],"answer":"a"},{"id":"structs-vs-classes-q11","type":"mcq","difficulty":1,"prompt":"Which type gets a free memberwise initializer that sets every property?","options":[{"id":"a","text":"A struct","explanation":"Right. Swift creates a memberwise initializer for a struct, unless you write your own init inside the struct."},{"id":"b","text":"A class","explanation":"Classes do not get a memberwise initializer. Without default values, you write `init` yourself."},{"id":"c","text":"Both","explanation":"Only structs get the memberwise initializer."},{"id":"d","text":"Neither","explanation":"Structs do get one, for example `Point(x: 0, y: 0)`."}],"answer":"a"},{"id":"structs-vs-classes-q12","type":"mcq","difficulty":2,"prompt":"Which type can have a `deinit` that runs when the instance is freed?","options":[{"id":"a","text":"A normal struct","explanation":"A normal struct cannot declare `deinit`. The compiler shows an error."},{"id":"b","text":"A class","explanation":"Right. Classes can use `deinit` to clean up when an instance is freed."},{"id":"c","text":"Both","explanation":"Only classes can have `deinit` here. A normal struct cannot."},{"id":"d","text":"Neither","explanation":"Classes can have `deinit`."}],"answer":"b"},{"id":"structs-vs-classes-q13","type":"mcq","difficulty":3,"prompt":"An interviewer says: \"Structs always live on the stack.\" What is the best reply?","options":[{"id":"a","text":"Yes, always. That is the reason structs are faster than classes.","explanation":"This is the common myth. Struct values are not always on the stack."},{"id":"b","text":"No. Structs always live on the heap, the same as classes.","explanation":"Struct values often live on the stack. They are just not always there."},{"id":"c","text":"Often, but not always. The key difference is copy versus share.","explanation":"Right. The compiler decides where memory goes. For example, a var that an escaping closure captures goes on the heap."},{"id":"d","text":"Neither. Swift has no stack or heap at all.","explanation":"Swift uses both. Class instances, for example, live on the heap."}],"answer":"c"},{"id":"structs-vs-classes-q14","type":"mcq","difficulty":3,"prompt":"A Swift package uses Swift 6 language mode. Code is not on the main actor by default. Which type is the easiest to share safely between tasks?","options":[{"id":"a","text":"A struct that holds a class that is not Sendable","explanation":"A struct is Sendable only if all its properties are Sendable."},{"id":"b","text":"A non-final class with var properties","explanation":"In this package, this class is not Sendable, and the compiler reports an error. In a new Xcode app project, it would be on the main actor and Sendable."},{"id":"c","text":"Any class, because it is a reference","explanation":"Being a reference makes sharing harder, not easier. Classes must follow strict rules."},{"id":"d","text":"A struct that is not public and has only Sendable properties","explanation":"Right. Such a struct is Sendable without extra work."}],"answer":"d"},{"id":"structs-vs-classes-q15","type":"mcq","difficulty":3,"prompt":"Copying a large `Array` is usually cheap. Why?","options":[{"id":"a","text":"Because Array is a class","explanation":"Array is a struct. It is a value type."},{"id":"b","text":"Because the copies share storage until one of them changes","explanation":"Right. This is copy-on-write. The real copy happens only when a copy changes."},{"id":"c","text":"Because Swift never copies arrays","explanation":"Swift does copy them, but only when one of the copies changes."},{"id":"d","text":"Because the copy is made on another thread","explanation":"Threads are not involved. The copy is delayed until a change."}],"answer":"b"},{"id":"structs-vs-classes-q16","type":"code-reading","difficulty":1,"prompt":"What does this code print?","code":"struct Point {\n    var x: Int\n}\n\nvar a = Point(x: 3)\nvar b = a\nb.x = 7\nprint(a.x, b.x)","options":[{"id":"a","text":"3 7","explanation":"Right. `b` is a copy, so changing it does not change `a`."},{"id":"b","text":"7 7","explanation":"That would happen with a class. A struct is copied."},{"id":"c","text":"3 3","explanation":"`b.x` was changed to 7, so `b` prints 7."},{"id":"d","text":"It does not compile.","explanation":"The code is valid. `a` and `b` are `var`, so `b` can change."}],"answer":"a"},{"id":"structs-vs-classes-q17","type":"code-reading","difficulty":1,"prompt":"What does this code print?","code":"class Point {\n    var x = 3\n}\n\nlet a = Point()\nlet b = a\nb.x = 7\nprint(a.x, b.x)","options":[{"id":"a","text":"3 7","explanation":"That would happen with a struct. Here `a` and `b` point to one instance."},{"id":"b","text":"7 7","explanation":"Right. Both names point to the same instance, so both see 7."},{"id":"c","text":"3 3","explanation":"The change through `b` changes the shared instance."},{"id":"d","text":"It does not compile, because a and b are let.","explanation":"`let` fixes the reference. The instance's `var` property can still change."}],"answer":"b"},{"id":"structs-vs-classes-q18","type":"code-reading","difficulty":2,"prompt":"What does this code print?","code":"struct Point {\n    var x: Int\n}\n\nfunc reset(_ point: Point) -> Point {\n    var copy = point\n    copy.x = 0\n    return copy\n}\n\nlet start = Point(x: 5)\nlet result = reset(start)\nprint(start.x, result.x)","options":[{"id":"a","text":"0 0","explanation":"The function works on a copy, so `start` keeps its value."},{"id":"b","text":"5 5","explanation":"The function sets the copy to 0 and returns it, so `result` is 0."},{"id":"c","text":"5 0","explanation":"Right. Passing a struct to a function gives the function a copy."},{"id":"d","text":"It does not compile.","explanation":"The code is valid. The function changes its own `var copy`."}],"answer":"c"},{"id":"structs-vs-classes-q19","type":"code-reading","difficulty":2,"prompt":"What does this code print?","code":"struct Item {\n    var count: Int\n}\n\nvar first = [Item(count: 1)]\nvar second = first\nsecond[0].count = 9\nprint(first[0].count)","options":[{"id":"a","text":"1","explanation":"Right. The array and the structs inside it are values, so `second` is a separate copy."},{"id":"b","text":"9","explanation":"That would happen if `Item` were a class. Here everything is a value."},{"id":"c","text":"0","explanation":"Nothing sets the count to 0."},{"id":"d","text":"It does not compile.","explanation":"The code is valid. `second` is a `var`, so it can change."}],"answer":"a"},{"id":"structs-vs-classes-q20","type":"code-reading","difficulty":2,"prompt":"What does this code print?","code":"class Item {\n    var count = 1\n}\n\nlet first = [Item()]\nlet second = first\nsecond[0].count = 9\nprint(first[0].count)","options":[{"id":"a","text":"1","explanation":"The array is copied, but both copies hold the same `Item` instance."},{"id":"b","text":"It does not compile, because the arrays are let.","explanation":"The arrays do not change. Only the shared `Item` instance changes."},{"id":"c","text":"0","explanation":"Nothing sets the count to 0."},{"id":"d","text":"9","explanation":"Right. Both arrays hold a reference to one shared `Item`."}],"answer":"d"},{"id":"structs-vs-classes-q21","type":"code-reading","difficulty":3,"prompt":"What does this code print?","code":"class Coach {\n    var name = \"Kim\"\n}\n\nstruct Team {\n    var title: String\n    let coach: Coach\n}\n\nlet teamA = Team(title: \"Red\", coach: Coach())\nvar teamB = teamA\nteamB.title = \"Blue\"\nteamB.coach.name = \"Ali\"\nprint(teamA.title, teamA.coach.name)","options":[{"id":"a","text":"Red Kim","explanation":"The title was copied, but the coach is a shared class instance."},{"id":"b","text":"Blue Ali","explanation":"The title was copied, so `teamA` keeps `Red`."},{"id":"c","text":"Red Ali","explanation":"Right. The struct copy has its own title, but both teams share one `Coach`."},{"id":"d","text":"It does not compile, because coach is a let property.","explanation":"`let` fixes the reference. The `Coach` instance can still change its `var` name."}],"answer":"c"},{"id":"structs-vs-classes-q22","type":"code-reading","difficulty":1,"prompt":"Find the bug. What happens when you build this code?","code":"struct Counter {\n    var count = 0\n\n    func increase() {\n        count += 1\n    }\n}\n\nvar counter = Counter()\ncounter.increase()\nprint(counter.count)","options":[{"id":"a","text":"It prints 1, because the method adds 1 to count.","explanation":"The code does not build. The method changes a property without `mutating`."},{"id":"b","text":"It prints 0, because the change is lost after the call.","explanation":"The code does not build, so it prints nothing."},{"id":"c","text":"It does not compile: increase() needs mutating.","explanation":"Right. A struct method that changes a property needs `mutating`."},{"id":"d","text":"It crashes when it runs, because count cannot change.","explanation":"Swift finds this problem when it builds the code, not when it runs."}],"answer":"c"},{"id":"structs-vs-classes-q23","type":"code-reading","difficulty":3,"prompt":"What happens when you build and run this code?","code":"class Settings {\n    var volume = 5\n}\n\nstruct Player {\n    let settings: Settings\n}\n\nlet player = Player(settings: Settings())\nplayer.settings.volume = 8\nprint(player.settings.volume)","options":[{"id":"a","text":"It prints 8.","explanation":"Right. The struct does not change: it still points to the same `Settings`. Only the class instance changes."},{"id":"b","text":"It prints 5.","explanation":"The change to `volume` happens on the class instance, so it prints 8."},{"id":"c","text":"It does not compile, because player is a let constant.","explanation":"The struct value does not change, because its reference stays the same. Only the shared instance changes."},{"id":"d","text":"It does not compile, because settings is a let property.","explanation":"`let` fixes which `Settings` instance it points to. That instance can still change."}],"answer":"a"},{"id":"structs-vs-classes-q24","type":"written","difficulty":1,"prompt":"Explain the difference between a struct and a class in Swift. Answer in 2–5 sentences.","rubric":[{"criterion":"Says that a struct is a value type that is copied when you assign it or pass it","weight":30,"key":true},{"criterion":"Says that a class is a reference type, so variables can share one instance","weight":30,"key":true},{"criterion":"Explains the result: a change to a struct copy does not affect the original, but a change through a class reference is seen by all","weight":25},{"criterion":"Mentions one more difference (inheritance, deinit, identity with ===) or that Apple recommends structs by default","weight":15}],"modelAnswer":"A struct is a value type, so Swift copies it when I assign it or pass it to a function. A class is a reference type, so two variables can point to the same instance. If I change a struct copy, the original stays the same. If I change a class instance through one variable, every other variable sees the change. Classes also support inheritance, and Apple recommends structs by default."},{"id":"structs-vs-classes-q25","type":"written","difficulty":2,"prompt":"Explain why a class instance in a `let` constant can still change its `var` properties, but a struct in a `let` constant cannot. Answer in 2–5 sentences.","rubric":[{"criterion":"Says that for a class, let fixes the reference, not the instance","weight":30,"key":true},{"criterion":"Says that the class instance can still change its var properties","weight":20},{"criterion":"Says that a let struct holds the value itself, so the whole value and all its properties are constant","weight":40,"key":true},{"criterion":"Links both cases to value type versus reference type","weight":10}],"modelAnswer":"With a class, the constant holds a reference, and let only stops the reference from changing. The instance it points to can still change its var properties. With a struct, the constant holds the value itself. So the whole value is constant, and none of its properties can change. This comes from structs being value types and classes being reference types."},{"id":"structs-vs-classes-q26","type":"written","difficulty":2,"prompt":"Which type do you use by default, and when would you choose a class instead? Give one real example from an iOS app. Answer in 2–5 sentences.","rubric":[{"criterion":"Says structs are the default choice","weight":15},{"criterion":"Gives a correct reason for a class: one shared instance with its own identity, inheritance from a class, or a framework that expects a class","weight":45,"key":true},{"criterion":"Gives a fitting example, such as a network client, a database connection, an image cache or a UIViewController subclass","weight":40}],"modelAnswer":"I use a struct by default. I choose a class when many parts of the app must share one instance with its own identity. For example, one network client or one image cache for the whole app should be a class. I also need a class when I subclass a UIKit class, like UIViewController."},{"id":"structs-vs-classes-q27","type":"written","difficulty":3,"prompt":"A struct has a property that holds a class instance. What happens when you copy the struct? Why can this cause bugs, and how can you avoid it? Answer in 2–5 sentences.","rubric":[{"criterion":"Says that the copy gets the same reference, so both copies share one class instance","weight":40,"key":true},{"criterion":"Says that the value properties of the struct are still copied separately","weight":20},{"criterion":"Explains the bug: a change through one copy unexpectedly shows up in the other","weight":30},{"criterion":"Suggests a fix or care, such as using a struct for that property or copying the object on purpose","weight":10}],"modelAnswer":"Copying the struct copies its values, but for the class property it copies only the reference. So both copies point to the same class instance. If code changes that instance through one copy, the other copy sees the change too. This is surprising, because people expect struct copies to be fully separate. To avoid it, use a value type for that property or copy the object on purpose."},{"id":"structs-vs-classes-q28","type":"written","difficulty":3,"prompt":"An interviewer says: \"Structs are faster because they live on the stack.\" How do you answer? Answer in 2–5 sentences.","rubric":[{"criterion":"Says the claim is only partly true: struct values are often, but not always, on the stack","weight":35,"key":true},{"criterion":"Gives an example of a struct value on the heap, such as a var that an escaping closure captures","weight":25},{"criterion":"Says class instances use heap allocation and reference counting, which has a cost","weight":20},{"criterion":"Says the main difference to explain is copy versus share, not where memory lives","weight":20}],"modelAnswer":"That is only partly true. Class instances use heap memory and reference counting, which costs more. Struct values are often on the stack, but the compiler decides. For example, a var that an escaping closure captures is stored on the heap. So I explain the main difference as copy versus share, not as stack versus heap."},{"id":"structs-vs-classes-q29","type":"code-write","difficulty":1,"prompt":"Write a struct `Book` with a `title` (String) and `pages` (Int). Create one book, copy it, and change the copy's `pages`. Print both page counts, so the output shows that the two books are separate.","starterCode":"// Write your code here\n","rubric":[{"criterion":"Declares a struct named Book with a String title and an Int pages","weight":25,"key":true},{"criterion":"Creates a book and copies it into a new var","weight":25},{"criterion":"Changes pages on the copy only","weight":25},{"criterion":"Prints both page counts, and the code would compile and show two different numbers","weight":25}],"modelAnswer":"struct Book {\n    var title: String\n    var pages: Int\n}\n\nlet original = Book(title: \"Swift\", pages: 100)\nvar copy = original\ncopy.pages = 250\nprint(original.pages, copy.pages)"},{"id":"structs-vs-classes-q30","type":"code-write","difficulty":2,"prompt":"Write a struct `Wallet` with a `balance` (Int) that starts at 0, and a method `add(_:)` that increases the balance. Create a wallet, add 20, and print the balance.","starterCode":"struct Wallet {\n    // Write your code here\n}\n","rubric":[{"criterion":"Declares var balance as an Int that starts at 0","weight":25},{"criterion":"Marks the add method as mutating","weight":40,"key":true},{"criterion":"The add method increases balance by the given amount","weight":15},{"criterion":"Stores the wallet in a var, calls add(20), and prints 20; the code would compile","weight":20}],"modelAnswer":"struct Wallet {\n    var balance = 0\n\n    mutating func add(_ amount: Int) {\n        balance += amount\n    }\n}\n\nvar wallet = Wallet()\nwallet.add(20)\nprint(wallet.balance)"},{"id":"structs-vs-classes-q31","type":"code-write","difficulty":2,"prompt":"Two screens must share the same settings. Today the code prints `false`. Change only the `AppSettings` type, so that the code prints `true`.","starterCode":"struct AppSettings {\n    var darkMode = false\n}\n\nvar screenA = AppSettings()\nvar screenB = screenA\nscreenB.darkMode = true\nprint(screenA.darkMode)\n","rubric":[{"criterion":"Changes AppSettings from a struct to a class","weight":50,"key":true},{"criterion":"Keeps darkMode as a var property with a default value","weight":20},{"criterion":"The code would compile and print true","weight":15},{"criterion":"Changes nothing after the type, as the prompt asks","weight":15}],"modelAnswer":"class AppSettings {\n    var darkMode = false\n}\n\nvar screenA = AppSettings()\nvar screenB = screenA\nscreenB.darkMode = true\nprint(screenA.darkMode)"}],"rules":{"pass":70,"skip":80,"size":10,"scoring":{"met":1,"partlyMet":0.5,"notMet":0,"keyMissedCap":50},"readiness":{"ready":85,"almost":70}},"mix":{"mcq":5,"code-reading":3,"written":1,"code-write":1},"levels":[{"id":"fresh","title":"Fresh"},{"id":"junior","title":"Junior"},{"id":"mid","title":"Mid"},{"id":"senior","title":"Senior"},{"id":"staff","title":"Staff"}],"units":[{"id":"swift-language","title":"Swift Language","topics":["swift-basics","optionals","operators","strings-and-characters","collections","control-flow","functions","closures-basics","enumerations","structs-vs-classes","properties","methods-and-initialization","error-handling","optional-chaining","inheritance","type-casting","protocols","extensions","generics-basics","access-control","closures-escaping-capture","codable","protocol-oriented-programming","generics-associated-types","opaque-and-boxed-types","copy-on-write","property-wrappers","macros"]},{"id":"coding-interview","title":"Coding Interview","topics":["big-o","arrays-and-strings","hash-tables","sorting-binary-search","two-pointers-sliding-window","stacks-and-queues","linked-lists","recursion","matrix-problems","trees-bfs-dfs","graphs","heaps","intervals"]},{"id":"memory","title":"Memory","topics":["arc-basics","strong-weak-unowned","retain-cycles","memory-graph-debugger","memory-profiling-instruments"]},{"id":"concurrency","title":"Concurrency","topics":["main-thread","gcd-basics","async-await","structured-concurrency","task-cancellation","async-sequences","actors-and-main-actor","sendable-data-races","swift-6-strict-concurrency","approachable-concurrency","migrating-to-async-await","concurrent-system-design"]},{"id":"swiftui","title":"SwiftUI","topics":["swiftui-views-modifiers","swiftui-layout","state-and-binding","swiftui-lists","swiftui-navigation","swiftui-observation","observable-object","forms-and-input","sheets-alerts-dialogs","swiftui-loading-data","view-identity-lifetime","swiftui-animations","swiftui-uikit-interop","swiftui-performance"]},{"id":"uikit","title":"UIKit","topics":["uiviews-and-view-controllers","view-controller-lifecycle","auto-layout","uikit-navigation","table-collection-views","custom-views-layout-pass"]},{"id":"design-accessibility","title":"Design and Accessibility","topics":["dark-mode-dynamic-type","accessibility","ipad-adaptive-layout"]},{"id":"app-and-system","title":"App and System","topics":["xcode-and-git-basics","app-lifecycle","permissions-privacy","signing-app-store","notifications","background-tasks","deep-links"]},{"id":"data-networking","title":"Data and Networking","topics":["http-rest-basics","urlsession","userdefaults-and-files","keychain-basics","swiftdata","core-data","caching","pagination","combine- function rubricScore(rubric, marks) {
  const s = D.rules.scoring; let total = 0, keyMissed = false;
  rubric.forEach((r, i) => { const m = marks[i] === 1 ? s.met : marks[i] === 0.5 ? s.partlyMet : s.notMet; total += r.weight * m; if (r.key && m === s.notMet) keyMissed = true; });

    '<p role="status"><b>' + (pass ? "Skipped! These " + count + " topics now count as done, each with " + pct + "%." : "Not passed. You need " + D.rules.skip + "%. Nothing changed.") + '</b></p>' +
    '<p class="small">' + right + ' of ' + n + ' right · ' + minutes + ' min. ' + (pass ? "You can still open any of these lessons." : "Try again later, or take the topics one by one.") + '</p></div>' +
    '<div class="row"><a class="btn btn-primary" href="' + D.links.path + '" target="_blank" rel="noopener">Back to the path</a>' + (pass ? '' : '<button class="btn btn-ghost" type="button" id="again">Try the skip test again</button>') + '</div>';
  $("again")?.addEventListener("click", () => startRun("skip"));
  window.scrollTo(0, 0);
}

// ---------- start screens ----------
function showStart(kind, note) {
  examChrome(false);
  const r = saved("run:" + kind);
  const isSkip = kind === "skip";
  $("screen").innerHTML = (note ? '<div class="banner" role="status"><b>' + esc(note) + '</b></div>' : '') +
    '<p class="eyebrow">' + (isSkip ? "Skip test" : "Exam") + '</p><h1>' + (isSkip ? "Skip Swift Language (Fresh)" : esc(D.topic.title)) + '</h1>' +
    '<div class="card"><p><b>' + (isSkip ? "10 questions from the 13 fresh Swift Language topics. In the app the test has " + D.rules.skip + "% to pass and covers every topic." : D.rules.size + " questions: 5 multiple choice, 3 read-the-code, 1 written answer and 1 code answer.") + '</b></p>' +
    '<p>You see the right answer after each question. There is no timer. You need <b>' + (isSkip ? D.rules.skip : D.rules.pass) + '%</b> to pass' + (isSkip ? ', and then these topics count as done with your score.' : '. You can try again as often as you like, with new questions.') + '</p>' +
    '<p class="small">If you leave, your answers are saved and you can continue later.</p></div>' +
    (r ? '<div class="banner"><b>Continue your ' + (isSkip ? "skip test" : "exam") + ' (question ' + (r.i + 1) + ' of ' + r.questions.length + ')</b><div class="row"><button class="btn btn-primary" type="button" id="resume">Continue</button><button class="btn btn-ghost" type="button" id="restart">Start again</button></div></div>'
       : '<div class="row"><button class="btn btn-primary" type="button" id="begin">' + (isSkip ? "Start the skip test" : "Start the exam") + '</button></div>');
  $("begin")?.addEventListener("click", () => startRun(kind));
  $("resume")?.addEventListener("click", () => resumeRun(kind));
  $("restart")?.addEventListener("click", () => { drop("run:" + kind); startRun(kind); });
  window.scrollTo(0, 0);
}

// ---------- S10 path complete (example scores) ----------
function pathComplete() {
  examChrome(false);
  const lvl = "junior", stages = D.levels.slice(0, D.levels.findIndex((l) => l.id === lvl) + 1);
  const sc = (id) => 72 + ([...id].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7) % 29);
  const rows = []; let all = [];
  for (const st of stages) {
    const us = D.units.map((u) => ({ u, ids: u.topics.filter((t) => D.levelOf[t] === st.id) })).filter((x) => x.ids.length);
    rows.push({ st, us: us.map(({ u, ids }) => { const scores = ids.map(sc); all.push(...scores); return { title: u.title, avg: Math.round(scores.reduce((a, b) => a + b, 0) / scores.length), n: ids.length }; }) });
  }
  const total = Math.round(all.reduce((a, b) => a + b, 0) / all.length);
  const flat = rows.flatMap((r) => r.us.map((u) => ({ ...u, stage: r.st.title })));
  const sorted = [...flat].sort((a, b) => b.avg - a.avg), strong = sorted.slice(0, 2), weak = sorted.slice(-2).reverse();
  const R = D.rules.readiness, label = total >= R.ready ? ["r1", "Interview ready", "Great work. You know the " + stages.at(-1).title.toLowerCase() + " topics well."] : ["r2", "Almost ready", "Review your weakest units, then take their exams again to raise your score."];
  $("screen").innerHTML = '<p class="small"><b>Example.</b> Scores below are example data for a junior path.</p>' +
    '<div class="resulthead"><h1 class="eyebrow">Path complete · Junior</h1><p class="score pass num">' + total + '%</p><p><b>Your total result for ' + all.length + ' topics.</b></p></div>' +
    '<div class="ready ' + label[0] + '"><p class="eyebrow">Readiness</p><p style="font-size:1.3rem;font-weight:700">' + label[1] + '</p><p>' + label[2] + '</p><p class="small">' + R.ready + '% or more: Interview ready. ' + R.almost + '–' + (R.ready - 1) + '%: Almost ready.</p></div>' +
    '<div class="stats"><div class="stat"><span class="small">Strongest</span><b>' + strong.map((s) => esc(s.title)).join(", ") + '</b></div><div class="stat"><span class="small">To review</span><b>' + weak.map((s) => esc(s.title) + " (" + s.stage + ")").join(", ") + '</b></div></div>' +
    '<h2>By stage and unit</h2><div class="card breakdown">' + rows.map((r) => '<p class="stage-h">' + r.st.title + '</p>' + r.us.map((u) => '<div class="brow"><span>' + esc(u.title) + ' <span class="small">· ' + u.n + ' topics</span></span><b class="num" style="text-align:right">' + u.avg + '%</b><div class="bar"><span style="width:' + u.avg + '%"></span></div></div>').join("")).join("") + '</div>' +
    '<h2>What next?</h2><div class="row"><button class="btn btn-primary" type="button">Try the mid level</button><button class="btn btn-ghost" type="button">See bonus topics</button><button class="btn btn-ghost" type="button">Export my progress</button></div>';
  window.scrollTo(0, 0);
}

// ---------- prototype screen switcher ----------
const SCREENS = [["Exam", () => showStart("topic")], ["Skip test", () => showStart("skip")], ["Path complete", pathComplete]];
SCREENS.forEach(([name, fn], i) => {
  const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = name; b.setAttribute("aria-pressed", String(i === 0));
  b.addEventListener("click", () => { [...$("screens").children].forEach((c) => c.setAttribute("aria-pressed", String(c === b))); fn(); });
  $("screens").append(b);
});
showStart("topic");
</script>
