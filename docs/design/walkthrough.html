<body>
  <header class="hub-header">
    <div class="brand-block">
      <span class="brand-pill">Prep Stops</span>
      <span class="brand-tagline">Phase 3 Interactive Walk-through · Calm Trail</span>
    </div>

    <nav class="flow-nav" role="tablist" aria-label="Walk-through flows">
      <button type="button" class="flow-btn ${i === 0 ? "active" : ""}" data-idx="${i}" role="tab" aria-selected="${i === 0 ? "true" : "false"}">${f.title}</button><button type="button" class="flow-btn ${i === 0 ? "active" : ""}" data-idx="${i}" role="tab" aria-selected="${i === 0 ? "true" : "false"}">${f.title}</button><button type="button" class="flow-btn ${i === 0 ? "active" : ""}" data-idx="${i}" role="tab" aria-selected="${i === 0 ? "true" : "false"}">${f.title}</button><button type="button" class="flow-btn ${i === 0 ? "active" : ""}" data-idx="${i}" role="tab" aria-selected="${i === 0 ? "true" : "false"}">${f.title}</button><button type="button" class="flow-btn ${i === 0 ? "active" : ""}" data-idx="${i}" role="tab" aria-selected="${i === 0 ? "true" : "false"}">${f.title}</button>
    </nav>

    <div class="controls">
      <div class="device-picker" role="group" aria-label="Preview width">
        <button type="button" class="device-btn" data-width="mobile" title="375px phone screen">375px</button>
        <button type="button" class="device-btn" data-width="tablet" title="720px tablet width">720px</button>
        <button type="button" class="device-btn active" data-width="full" title="100% desktop width">Full</button>
      </div>

      <button type="button" class="tool-btn" id="themeToggle" aria-label="Toggle theme">🌓 Theme</button>
      <a class="tool-btn" id="openExternal" href="start-prototype.html" target="_blank" rel="noopener">Open standalone ↗</a>
    </div>
  </header>

  <aside class="guide-bar" aria-label="Flow guide">
    <div class="guide-text">
      <div id="guideTitle"><b>1. Start & Level Picker</b> — First visit onboarding and settings</div>
      <div class="guide-screens" id="guideScreens">S1 Welcome · S2 Level picker · S11 Settings · S12 About · Error states</div>
    </div>
    <div class="guide-actions">
      <button type="button" class="flow-btn" id="prevFlow" disabled>← Previous</button>
      <button type="button" class="flow-btn" id="nextFlow">Next Flow →</button>
    </div>
  </aside>

  <main class="viewport-container">
    <div class="frame-wrapper full" id="frameWrapper">
      <iframe id="viewer" src="start-prototype.html" title="Interactive prototype viewer"></iframe>
    </div>
  </main>

  <script>
    const flows = [{"id":"start","title":"1. Start & Level Picker","src":"start-prototype.html","screens":"S1 Welcome · S2 Level picker · S11 Settings · S12 About · Error states","summary":"First visit onboarding, self-check level suggestion (recommends level when ≥50% ticked), theme switch (Light/Dark/Device), browser storage banner, and progress JSON file export / import / reset.","tryThis":["Click through the self-check checkboxes to see suggested levels update in real time.","Pick a level and click 'Open my path' (leads to the Path Map).","Switch to 'Progress and settings' to see unit breakdown, or test the simulated storage block & import errors."]},{"id":"path","title":"2. Path Map (Winding Road)","src":"path-map-prototype.html","screens":"S3 Path map · S4 Locked stop card","summary":"The winding road path showing all 164 curriculum topics arranged across stages and 14 subject units. Features folding finished stages, unit signposts, stop cards with 6 visual states, and skip-test entry points.","tryThis":["Tap any topic stop to inspect its card: locked stops guide you to prerequisites, current stops offer 'Start lesson'.","Tap 'Structs vs Classes' to open the pilot lesson.","Try 'Skip this stage' or 'Skip this unit' buttons to preview skip test requirements (80% pass mark)."]},{"id":"lesson","title":"3. Lesson Experience","src":"lesson-prototype.html","screens":"S5 Lesson page (Structs vs Classes)","summary":"Research-based 8-step lesson layout in simple English (CEFR B1). Includes guess first, copy vs shared concept, illustrated interactive diagram, code examples verified with Swift 6.4, interview traps, sample answers, and recap.","tryThis":["Step through using Back / Continue buttons, or use the top stepbar.","Interact with the diagram on step 3 (Next / Back / Replay) and test keyboard arrow keys.","Test the font size switcher (Normal / Large / Larger) in the top bar.","Click 'Start the exam' on the final step to launch the exam."]},{"id":"exam","title":"4. Exam & Results","src":"exam-prototype.html","screens":"S6 Exam · S7 Topic result · S8 Skip test · S9 Skip result · S10 Path complete","summary":"Topic exam drawn from the 31-question bank (shuffled options every run). Features instant feedback, rubric scoring with half points and key-point caps, 70% topic pass mark, mistake review, and overall path readiness scoring.","tryThis":["Answer questions and click 'Check answer' to view instant explanations.","Finish the exam to view the result screen (passed vs not passed, mistake review, best score).","Use the prototype switcher at the top to preview Skip Test (80% pass mark) and Path Complete screens."]},{"id":"design","title":"5. Design System","src":"design-system.html","screens":"Tokens · WCAG AA Contrast · 11 UI Component Groups","summary":"The single source of truth for UI components and tokens. Verified 17 color pairs in both Light and Dark modes with 0 contrast failures (>4.5:1 ratio). All sizes built to be accessible at 375px mobile width.","tryThis":["Review the WCAG contrast test matrix for light and dark themes.","Check interactive states for buttons, cards, tags, alerts, option rows, and code blocks.","Toggle dark mode to verify token harmony."]}];
    let currentIdx = 0;
    let currentWidth = "full";
    let isDark = false;

    const viewer = document.getElementById("viewer");
    const frameWrapper = document.getElementById("frameWrapper");
    const guideTitle = document.getElementById("guideTitle");
    const guideScreens = document.getElementById("guideScreens");
    const openExternal = document.getElementById("openExternal");
    const flowButtons = document.querySelectorAll(".flow-btn[data-idx]");
    const deviceButtons = document.querySelectorAll(".device-btn");
    const prevBtn = document.getElementById("prevFlow");
    const nextBtn = document.getElementById("nextFlow");
    const themeToggle = document.getElementById("themeToggle");

    function updateFlow(idx) {
      currentIdx = Math.max(0, Math.min(flows.length - 1, idx));
      const f = flows[currentIdx];
      viewer.src = f.src;
      openExternal.href = f.src;
      guideTitle.innerHTML = '<b>' + f.title + '</b> — ' + f.summary;
      guideScreens.textContent = f.screens;

      flowButtons.forEach((b, i) => {
        const active = i === currentIdx;
        b.classList.toggle("active", active);
        b.setAttribute("aria-selected", String(active));
      });

      prevBtn.disabled = currentIdx === 0;
      nextBtn.disabled = currentIdx === flows.length - 1;
    }

    flowButtons.forEach((b) => b.addEventListener("click", () => updateFlow(Number(b.dataset.idx))));
    prevBtn.addEventListener("click", () => updateFlow(currentIdx - 1));
    nextBtn.addEventListener("click", () => updateFlow(currentIdx + 1));

    deviceButtons.forEach((b) => {
      b.addEventListener("click", () => {
        deviceButtons.forEach((btn) => btn.classList.remove("active"));
        b.classList.add("active");
        currentWidth = b.dataset.width;
        frameWrapper.className = 'frame-wrapper ' + currentWidth;
      });
    });

    themeToggle.addEventListener("click", () => {
      isDark = !isDark;
      document.documentElement.classList.toggle("dark", isDark);
      try {
        viewer.contentDocument.documentElement.classList.toggle("dark", isDark);
      } catch {}
    });

    // Keyboard navigation: Option + Left/Right arrows switch flows
    document.addEventListener("keydown", (e) => {
      if (e.altKey && e.key === "ArrowRight") updateFlow(currentIdx + 1);
      if (e.altKey && e.key === "ArrowLeft") updateFlow(currentIdx - 1);
    });
  </script>
